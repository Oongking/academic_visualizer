<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matrices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Sans+Thai:wght@500;600&display=swap">
<style>
/* ============================================================
   LEARNING PACKAGE ENGINE — shared stylesheet
   Visual identity: Editorial / Museum  (Project Concept §11)
   Tokens only. No colour is ever defined solely in a media query.
   ============================================================ */
:root{
  --ground:#FFFFFF; --surface:#FBFAF9;
  --ink:#0C0B0C; --ink-soft:#4A474A; --ink-faint:#9B979A;
  --rule:#E7E4E4; --accent:#E63946; --on-accent:#FFFFFF;
  --good:#1B7F5A; --warn:#B4690E;
  --f-display:"Bodoni Moda",Didot,"Bodoni MT",Georgia,serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --radius:0px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C0C0D; --surface:#141415;
    --ink:#F2F0EE; --ink-soft:#B0ACA9; --ink-faint:#77736F;
    --rule:#262525; --accent:#FF5A66; --on-accent:#14090A;
    --good:#3FBF8F; --warn:#E0A040;
  }
}
:root[data-theme="dark"]{
  --ground:#0C0C0D; --surface:#141415;
  --ink:#F2F0EE; --ink-soft:#B0ACA9; --ink-faint:#77736F;
  --rule:#262525; --accent:#FF5A66; --on-accent:#14090A;
  --good:#3FBF8F; --warn:#E0A040;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:17px;line-height:1.68;-webkit-font-smoothing:antialiased}
.shell{max-width:1180px;margin:0 auto;padding:0 28px 96px}
@media (max-width:640px){ .shell{padding:0 18px 64px} }

.label{font-family:var(--f-ui);font-size:11px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.label.accent{color:var(--accent)}

header.mast{display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding:26px 0 18px;margin-bottom:30px}
.mast-id{display:flex;flex-direction:column;gap:3px}
.mast-id .ch{font-family:var(--f-ui);font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.mast-id h1{margin:0;font-family:var(--f-display);font-weight:400;
  font-size:clamp(26px,4vw,40px);line-height:1.05;letter-spacing:-.015em}
.mast-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.06em;
  padding:7px 13px;border:1px solid var(--rule);background:transparent;
  color:var(--ink-soft);cursor:pointer;border-radius:var(--radius);
  transition:border-color .14s,color .14s}
.btn:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

nav.surfaces{display:flex;border-bottom:1px solid var(--rule);margin-bottom:38px}
nav.surfaces button{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;background:transparent;border:none;cursor:pointer;
  color:var(--ink-faint);padding:12px 20px 13px;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:color .14s,border-color .14s}
nav.surfaces button:hover{color:var(--ink)}
nav.surfaces button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.surfaces button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.view{display:none}
.view.active{display:block}

.eyebrow{font-family:var(--f-ui);font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
h2.sec{margin:0 0 8px;font-family:var(--f-display);font-weight:400;
  font-size:clamp(24px,3.2vw,32px);line-height:1.12;letter-spacing:-.015em}
.lede{margin:0 0 30px;color:var(--ink-soft);max-width:64ch;font-size:17px}

.plate{border:1px solid var(--rule);background:var(--surface);padding:22px;margin:0}
.plate figcaption{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);margin-top:14px;text-align:center}

/* ---------- MAP ---------- */
.map-wrap{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:860px){ .map-wrap{grid-template-columns:1fr} }
#mapsvg{width:100%;height:auto;display:block}
.mnode{cursor:pointer}
.mnode rect{fill:var(--ground);stroke:var(--rule);stroke-width:1.5;transition:all .18s}
.mnode text{font-family:var(--f-ui);font-size:11.5px;font-weight:600;
  fill:var(--ink-faint);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.mnode[data-state="upcoming"]{opacity:.5}
.mnode[data-state="available"] rect{stroke:var(--ink-soft)}
.mnode[data-state="available"] text{fill:var(--ink)}
.mnode[data-state="read"] rect{fill:var(--ink);stroke:var(--ink)}
.mnode[data-state="read"] text{fill:var(--ground)}
.mnode[data-state="trained"] rect{fill:var(--ink);stroke:var(--accent);stroke-width:2.5}
.mnode[data-state="trained"] text{fill:var(--ground)}
.mnode[data-current="1"] rect{stroke:var(--accent);stroke-width:3}
.mnode:hover rect{stroke:var(--accent)}
.mnode:focus-visible rect{stroke:var(--accent);stroke-width:3}
.medge{stroke:var(--rule);stroke-width:1.5;fill:none}
.medge.lit{stroke:var(--ink-soft)}
.medge.ext{stroke-dasharray:4 4;stroke:var(--ink-faint);opacity:.6}
.mext text{font-family:var(--f-ui);font-size:10.5px;fill:var(--ink-faint);text-anchor:middle}

.legend{display:flex;flex-direction:column;gap:15px}
.legend-row{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink-soft)}
.swatch{width:34px;height:20px;flex:0 0 auto;border:1.5px solid var(--rule);background:var(--ground);margin-top:2px}
.swatch.up{opacity:.5}
.swatch.avail{border-color:var(--ink-soft)}
.swatch.read{background:var(--ink);border-color:var(--ink)}
.swatch.trained{background:var(--ink);border-color:var(--accent);border-width:2.5px}
.legend-row b{display:block;color:var(--ink);font-family:var(--f-ui);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:2px}
.prog{border:1px solid var(--rule);padding:16px 18px;background:var(--surface)}
.prog .big{font-family:var(--f-display);font-size:34px;line-height:1;margin:6px 0 2px}

/* ---------- NODE SECTIONS ---------- */
.chapter-rule{border:none;border-top:1px solid var(--rule);margin:56px 0 0}
.node-sec{padding:52px 0;border-bottom:1px solid var(--rule);scroll-margin-top:20px}
.node-sec:last-child{border-bottom:none}
.node-head{display:flex;gap:18px;align-items:baseline;margin-bottom:20px}
.node-num{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.14em;
  color:var(--ink-faint);flex:0 0 auto;padding-top:6px}
.node-sec h3{margin:0;font-family:var(--f-display);font-weight:400;
  font-size:clamp(28px,4vw,40px);line-height:1.08;letter-spacing:-.015em}
.node-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:start}
.node-sec[data-nolab="1"] .node-split{grid-template-columns:minmax(0,66ch)}
@media (max-width:1000px){ .node-split{grid-template-columns:1fr;gap:28px} }
.node-body p{margin:0 0 18px;color:var(--ink-soft)}
.node-body .keyterm{color:var(--ink);font-weight:600}

.formula{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);
  padding:18px 0;margin:26px 0;text-align:center;
  font-family:var(--f-display);font-size:clamp(19px,2.4vw,25px);color:var(--ink)}
.formula small{display:block;font-family:var(--f-ui);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:10px}

.methods-here{border:1px solid var(--rule);padding:14px 16px;margin-top:24px;background:var(--surface)}
.methods-here .label{margin-bottom:8px;display:block}
.mtag{display:inline-block;font-family:var(--f-ui);font-size:10.5px;font-weight:600;
  letter-spacing:.08em;padding:3px 8px;border:1px solid var(--rule);color:var(--ink-soft);margin:2px 4px 2px 0}

/* ---------- LAB ---------- */
.lab{border:1px solid var(--rule);background:var(--surface);margin:0;position:sticky;top:16px}
@media (max-width:1000px){ .lab{position:static} }
.lab-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--rule)}
.lab-mode{display:flex;gap:6px}
.lab svg{display:block;width:100%;height:auto}
/* Art plate. The picture is its own layer under the scene so an animating
   visualizer never re-decodes it, and the caption sits beneath the frame in
   the utility face, the way every plate in this house style is captioned. */
.lab-stage{position:relative}
.lab-stage .labart{position:absolute;left:0;top:0;width:100%;height:100%;
  pointer-events:none}
.lab-stage .labart[hidden]{display:none}
/* A neutral texture may be flipped for the dark theme; authored artwork never
   is - it either ships a dark variant or steps aside. */
.lab-stage .labart .art-invert{filter:invert(1) brightness(.92)}
.lab-cap{margin:0;padding:12px 16px 0;font-family:var(--f-ui);font-size:11px;
  font-weight:500;letter-spacing:.04em;color:var(--ink-faint);line-height:1.5}
.lab-body{padding:16px}
.guide{border-left:2px solid var(--accent);padding:10px 14px;margin-bottom:14px;
  background:var(--ground);min-height:62px;display:flex;flex-direction:column;justify-content:center}
.guide p{margin:0;font-size:15px;color:var(--ink-soft)}
.guide .step{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:14px}
.ctrl label{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-ui);
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:5px}
.ctrl label span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
/* touch-action:none is what keeps a drag on the control from being handed to
   the page as a scroll gesture - on a trackpad, pen or touchscreen the browser
   otherwise takes the gesture partway through and the thumb stops following
   until you press again. The extra height is hit area, not decoration: the
   default track is about 16px tall and easy to catch the edge of. */
.ctrl input[type=range]{width:100%;height:24px;margin:0;accent-color:var(--accent);
  cursor:pointer;touch-action:none}
.readouts{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.ro b{display:block;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:3px}
.ro span{font-family:var(--f-display);font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.transport{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ---------- FORGE ---------- */
.forge-grid{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:940px){ .forge-grid{grid-template-columns:1fr} }
.bp{border:1px solid var(--rule);background:var(--surface);padding:18px;position:sticky;top:16px}
@media (max-width:940px){ .bp{position:static} }
.bp h4{margin:0 0 4px;font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.bp-group{margin-bottom:18px}
.check{display:flex;gap:9px;align-items:flex-start;padding:4px 0;cursor:pointer;font-size:13.5px;color:var(--ink-soft)}
.check input{margin:5px 0 0;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
.check code{font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.05em}
.bp select,.bp input[type=number]{width:100%;font-family:var(--f-ui);font-size:13px;padding:7px 9px;
  border:1px solid var(--rule);background:var(--ground);color:var(--ink);border-radius:var(--radius)}
.gen{width:100%;margin-top:6px;background:var(--accent);color:var(--on-accent);
  border-color:var(--accent);font-size:13px;padding:11px}
.gen:hover{opacity:.88;border-color:var(--accent);color:var(--on-accent)}

.qlist{display:flex;flex-direction:column;gap:18px}
.q{border:1px solid var(--rule);background:var(--surface)}
.q-top{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
.tg{font-family:var(--f-ui);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--rule);color:var(--ink-faint)}
.tg.m{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.q-body{padding:16px}
.q-stem{margin:0 0 14px;font-size:16px;color:var(--ink)}
.q-fig{margin:0 0 14px;border:1px solid var(--rule);background:var(--ground);padding:10px}
.q-fig svg{display:block;width:100%;max-width:320px;margin:0 auto;height:auto}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:11px;align-items:baseline;text-align:left;width:100%;
  font-family:var(--f-body);font-size:15px;padding:10px 13px;cursor:pointer;
  border:1px solid var(--rule);background:var(--ground);color:var(--ink-soft);
  border-radius:var(--radius);transition:border-color .14s}
.opt:hover:not(:disabled){border-color:var(--ink-soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt b{font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--ink-faint);flex:0 0 auto}
.opt:disabled{cursor:default}
.opt[data-mark="right"]{border-color:var(--good);color:var(--ink)}
.opt[data-mark="right"] b{color:var(--good)}
.opt[data-mark="wrong"]{border-color:var(--warn);color:var(--ink)}
.opt[data-mark="wrong"] b{color:var(--warn)}
.fb{margin-top:13px;padding:11px 13px;border-left:2px solid var(--good);
  background:var(--ground);font-size:14px;color:var(--ink-soft)}
.fb.trap{border-left-color:var(--warn)}
.fb b{color:var(--ink);font-family:var(--f-ui);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;display:block;margin-bottom:4px;font-weight:600}

.cov{margin-top:34px;overflow-x:auto}
.cov table{border-collapse:collapse;width:100%;min-width:520px}
.cov th,.cov td{border:1px solid var(--rule);padding:9px 10px;text-align:center;
  font-family:var(--f-ui);font-size:11.5px;font-variant-numeric:tabular-nums}
.cov th{color:var(--ink-faint);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.cov th.rowh{text-align:left;color:var(--ink);max-width:210px;white-space:normal;line-height:1.35}
.cov td{color:var(--ink-faint)}
.cov td[data-hit="1"]{background:var(--ink);color:var(--ground);font-weight:600}
.cov td[data-hit="miss"]{color:var(--warn)}

footer.foot{border-top:1px solid var(--rule);margin-top:64px;padding-top:22px;
  font-family:var(--f-ui);font-size:11.5px;color:var(--ink-faint);
  display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;letter-spacing:.04em}
.foot a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--rule)}
.foot a:hover{color:var(--accent);border-bottom-color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
</head>
<body>
<div class="shell">

<header class="mast">
  <div class="mast-id">
    <span class="ch" id="chNum"></span>
    <h1 id="chTitle"></h1>
  </div>
  <div class="mast-tools">
    <button class="btn" id="langBtn" type="button">ไทย</button>
    <button class="btn" id="themeBtn" type="button">Dark</button>
    <button class="btn" id="resetBtn" type="button" data-i18n="ui.reset">Reset progress</button>
  </div>
</header>

<nav class="surfaces" role="tablist">
  <button role="tab" aria-selected="true"  data-view="learn" data-i18n="nav.learn">Learn</button>
  <button role="tab" aria-selected="false" data-view="forge" data-i18n="nav.forge">Forge</button>
</nav>

<section class="view active" id="view-learn" role="tabpanel">
  <div class="eyebrow" data-i18n="map.eyebrow">The knowledge map</div>
  <h2 class="sec" id="mapTitle"></h2>
  <p class="lede" id="mapLede"></p>

  <div class="map-wrap">
    <figure class="plate">
      <svg id="mapsvg" viewBox="0 0 470 422" role="img"
           aria-labelledby="chmap-title chmap-desc">
        <title id="chmap-title" data-en="Matrices knowledge map"
               data-th="Matrices แผนที่ความรู้">Matrices knowledge map</title>
        <desc id="chmap-desc"
              data-en="The concepts in this chapter and the order they unlock in: an arrow runs from a concept to the ones that need it first. Each box is a link to that concept, and its outline shows whether it is upcoming, next up, read, or trained."
              data-th="แนวคิดในบทนี้และลำดับการปลดล็อก ลูกศรชี้จากแนวคิดหนึ่งไปยังแนวคิดที่ต้องใช้แนวคิดนั้นก่อน แต่ละกล่องเป็นลิงก์ไปยังแนวคิดนั้น และเส้นขอบบอกสถานะว่ายังไม่ถึง ถึงคิวแล้ว อ่านแล้ว หรือฝึกจนคล่อง">The concepts in this chapter and the order they unlock in.</desc>
        <defs>
          <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5"
                  orient="auto" markerUnits="userSpaceOnUse">
            <path d="M0 1 L6 3.5 L0 6 z" fill="currentColor"/>
          </marker>
        </defs>
        <g id="edges" color="var(--ink-faint)"></g>
        <g id="nodes"></g>
        <g class="mext"><text id="mapExt" x="235" y="408"></text></g>
      </svg>
      <figcaption id="mapFig"></figcaption>
    </figure>

    <div class="legend">
      <div class="prog">
        <span class="label" data-i18n="map.progress">Progress</span>
        <div class="big"><span id="progNum">0</span><span id="progTot" style="color:var(--ink-faint)"></span></div>
        <span style="font-size:13.5px;color:var(--ink-soft)" data-i18n="map.progressSub">nodes read</span>
      </div>
      <div class="legend-row"><span class="swatch up"></span><span><b data-i18n="map.s1"></b><span data-i18n="map.s1d"></span></span></div>
      <div class="legend-row"><span class="swatch avail"></span><span><b data-i18n="map.s2"></b><span data-i18n="map.s2d"></span></span></div>
      <div class="legend-row"><span class="swatch read"></span><span><b data-i18n="map.s3"></b><span data-i18n="map.s3d"></span></span></div>
      <div class="legend-row"><span class="swatch trained"></span><span><b data-i18n="map.s4"></b><span data-i18n="map.s4d"></span></span></div>
    </div>
  </div>

  <hr class="chapter-rule">
  <div id="nodeSections"></div>
</section>

<section class="view" id="view-forge" role="tabpanel">
  <div class="eyebrow" data-i18n="forge.eyebrow">The forge</div>
  <h2 class="sec" data-i18n="forge.title"></h2>
  <p class="lede" data-i18n="forge.lede"></p>

  <div class="forge-grid">
    <aside class="bp">
      <div class="bp-group"><h4 data-i18n="forge.methods"></h4><div id="bpMethods"></div></div>
      <div class="bp-group"><h4 data-i18n="forge.surfaces"></h4><div id="bpSurfaces"></div></div>
      <div class="bp-group"><h4 data-i18n="forge.mode"></h4>
        <select id="bpMode">
          <option value="coverage" data-i18n="forge.modeCov"></option>
          <option value="random" data-i18n="forge.modeRnd"></option>
        </select>
      </div>
      <div class="bp-group"><h4 data-i18n="forge.count"></h4>
        <input type="number" id="bpCount" min="4" max="40" value="12"></div>
      <button class="btn gen" id="genBtn" type="button" data-i18n="forge.generate"></button>
    </aside>
    <div>
      <div class="qlist" id="qlist"></div>
      <div class="cov">
        <div class="label" style="margin-bottom:10px" data-i18n="forge.coverage"></div>
        <table id="covTable"></table>
      </div>
    </div>
  </div>
</section>

{ id:"multiplication", x:100, y:150, requires:["basics"], methods:["M-02"],
  title:["Multiplication","การคูณ"],
  body:[["To multiply A by B the inner dimensions must agree: an m × p times a p × n gives an m × n. The entry in row i, column j is the row i of A paired term by term with column j of B and summed.",
         "Matrix multiplication is not commutative. AB and BA are usually different, and often only one of them is even defined. Assuming AB = BA is trap T-01 and it invalidates every step that follows it."],
        ["การคูณ A กับ B ต้องให้มิติด้านในตรงกัน เมทริกซ์ m × p คูณ p × n ได้ผลลัพธ์ m × n สมาชิกในแถวที่ i หลักที่ j คือแถวที่ i ของ A จับคู่ทีละพจน์กับหลักที่ j ของ B แล้วบวกกัน",
         "การคูณเมทริกซ์สลับที่ไม่ได้ AB กับ BA มักไม่เท่ากัน และบ่อยครั้งมีเพียงตัวเดียวที่นิยามได้ด้วยซ้ำ การสมมติว่า AB = BA คือกับดัก T-01 และมันทำให้ทุกขั้นตอนหลังจากนั้นใช้ไม่ได้"]],
  formula:["(m×p)(p×n) = m×n        AB ≠ BA in general","(m×p)(p×n) = m×n        โดยทั่วไป AB ≠ BA"],

  viz:"grid",

    cols:[["A","A"],["B","B"],["Inner sizes","ขนาดด้านใน"],["AB","AB"],["BA","BA"]],

          : (L()?"ไม่ — คนละมิติหรือทำไม่ได้เลย":"no — different orders, or not even defined"); }},

    note:["AB can exist while BA does not — matrix multiplication is not commutative","AB อาจมีอยู่ขณะที่ BA ไม่มี การคูณเมทริกซ์ไม่มีสมบัติสลับที่"]
  } },

{ id:"determinant", x:370, y:150, requires:["basics"], methods:["M-03"],
  title:["The determinant","ดีเทอร์มิแนนต์"],
  body:[["For a 2×2 the determinant is ad − bc; for larger square matrices you expand along a row or column using cofactors, choosing whichever line has the most zeros. Only square matrices have one at all.",
         "Geometrically the 2×2 determinant is the signed area of the parallelogram spanned by the two columns. Drive the lab until that area collapses to nothing: the columns have become parallel, the determinant is zero, and the matrix is singular — which is precisely why it cannot be inverted."],
        ["สำหรับ 2×2 ดีเทอร์มิแนนต์คือ ad − bc สำหรับเมทริกซ์จัตุรัสที่ใหญ่กว่าให้กระจายตามแถวหรือหลักด้วยโคแฟกเตอร์ โดยเลือกแนวที่มีศูนย์มากที่สุด มีเพียงเมทริกซ์จัตุรัสเท่านั้นที่มีดีเทอร์มิแนนต์",
         "ในเชิงเรขาคณิต ดีเทอร์มิแนนต์ของ 2×2 คือพื้นที่มีเครื่องหมายของสี่เหลี่ยมด้านขนานที่สร้างจากสองหลัก ลองปรับในห้องทดลองจนพื้นที่ยุบเป็นศูนย์ หลักทั้งสองจะขนานกัน ดีเทอร์มิแนนต์เป็นศูนย์ และเมทริกซ์เป็นเอกฐาน ซึ่งเป็นเหตุผลว่าทำไมจึงหาอินเวอร์สไม่ได้"]],
  formula:["det = ad − bc        det(AB) = det(A)·det(B)","det = ad − bc        det(AB) = det(A)·det(B)"],
  flabel:["Zero determinant means singular","ดีเทอร์มิแนนต์ศูนย์คือเอกฐาน"],
  viz:{
    vb:"0 0 560 330", anim:false,
    ctrls:[
      {k:"a", lab:["a  (col 1, x)","a  (หลัก 1, x)"], min:-6, max:6, step:1, def:3, unit:""},
      {k:"c", lab:["c  (col 1, y)","c  (หลัก 1, y)"], min:-6, max:6, step:1, def:1, unit:""},
      {k:"b", lab:["b  (col 2, x)","b  (หลัก 2, x)"], min:-6, max:6, step:1, def:1, unit:""},
      {k:"d", lab:["d  (col 2, y)","d  (หลัก 2, y)"], min:-6, max:6, step:1, def:4, unit:""}
    ],
    readouts:[
      {lab:["det = ad − bc","det = ad − bc"], f:function(S){
        return fmt(S.p.a*S.p.d - S.p.b*S.p.c); }},
      {lab:["Area","พื้นที่"], f:function(S){
        return fmt(Math.abs(S.p.a*S.p.d - S.p.b*S.p.c))+" sq units"; }},
      {lab:["Invertible","หาอินเวอร์สได้"], f:function(S){
        var d=S.p.a*S.p.d-S.p.b*S.p.c;
        return Math.abs(d)<1e-9 ? (L()?"ไม่ได้ · เอกฐาน":"no · singular") : (L()?"ได้":"yes"); }}
    ],
    draw:function(S,o){
      var p=S.p, det=p.a*p.d-p.b*p.c;
      var A=axes(o,{x:58,y:44,w:462,h:212,xmin:-8,xmax:8,ymin:-8,ymax:8,
                    title:["THE COLUMNS AS VECTORS","คอลัมน์ในฐานะเวกเตอร์"],xlab:"x",ylab:"y"});
      var O=[A.X(0),A.Y(0)];
      var v1=[A.X(p.a),A.Y(p.c)], v2=[A.X(p.b),A.Y(p.d)];
      var v3=[A.X(p.a+p.b),A.Y(p.c+p.d)];
      /* the parallelogram the two columns span — its area IS |det| */
      o.push('<path d="M'+O[0]+' '+O[1]+' L'+v1[0]+' '+v1[1]+' L'+v3[0]+' '+v3[1]+' L'+v2[0]+' '+v2[1]+' Z" '+
             'fill="var(--accent)" fill-opacity="'+(Math.abs(det)<1e-9?0.05:0.18)+'" stroke="var(--accent)" stroke-width="1.2"/>');
      function arrow(x2,y2,col,lab){
        var ang=Math.atan2(y2-O[1],x2-O[0]), h=9;
        o.push('<line x1="'+O[0]+'" y1="'+O[1]+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="2.4"/>');
        if(Math.abs(x2-O[0])+Math.abs(y2-O[1])>4)
          o.push('<path d="M'+x2+' '+y2+' L'+(x2-h*Math.cos(ang-.4))+' '+(y2-h*Math.sin(ang-.4))+
                 ' L'+(x2-h*Math.cos(ang+.4))+' '+(y2-h*Math.sin(ang+.4))+' Z" fill="'+col+'"/>');
        o.push('<text x="'+(x2+8)+'" y="'+(y2-6)+'" fill="'+col+'" font-family="IBM Plex Sans" font-size="11" font-weight="600">'+lab+'</text>');
      }
      arrow(v1[0],v1[1],"var(--ink)","col 1");
      arrow(v2[0],v2[1],"var(--ink-soft)","col 2");
      /* the matrix written out, and the verdict */
      o.push('<text x="58" y="292" fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="10">'+tx(["MATRIX","เมทริกซ์"])+'</text>');
      o.push('<text x="58" y="312" fill="var(--ink)" font-family="Bodoni Moda" font-size="17">[ '+p.a+'  '+p.b+' ;  '+p.c+'  '+p.d+' ]</text>');
      var msg = Math.abs(det)<1e-9
        ? "det = 0 — the columns are parallel, the area collapsed, no inverse exists"
        : "det = "+fmt(det)+" — the shaded area, signed";
      o.push('<text x="300" y="312" fill="'+(Math.abs(det)<1e-9?"var(--warn)":"var(--ink-faint)")+
             '" font-family="IBM Plex Sans" font-size="10.5">'+msg+'</text>');
    }
  },
  guide:[
    {say:["The two columns of the matrix, drawn as vectors from the origin. The shaded parallelogram is what they span.",
          "สองหลักของเมทริกซ์ วาดเป็นเวกเตอร์จากจุดกำเนิด สี่เหลี่ยมด้านขนานที่แรเงาคือสิ่งที่ทั้งสองสร้างขึ้น"], set:{a:3,c:1,b:1,d:4}},
    {say:["Read the determinant and the area. They are the same number — the sign only records the orientation.",
          "อ่านค่าดีเทอร์มิแนนต์กับพื้นที่ ทั้งสองคือตัวเลขเดียวกัน เครื่องหมายเพียงบันทึกทิศการวน"], set:{a:4,c:0,b:0,d:3}},
    {say:["Now make column 2 a multiple of column 1. The parallelogram flattens to a line and the area vanishes.",
          "ทีนี้ทำให้หลัก 2 เป็นจำนวนเท่าของหลัก 1 สี่เหลี่ยมด้านขนานแบนเป็นเส้น และพื้นที่หายไป"], set:{a:2,c:1,b:4,d:2}},
    {say:["det = 0. There is no inverse, because the matrix has squashed the plane onto a line and nothing can undo that.",
          "det = 0 ไม่มีอินเวอร์ส เพราะเมทริกซ์บีบระนาบลงเป็นเส้น และไม่มีอะไรย้อนกลับได้"], set:{a:2,c:1,b:4,d:2}}
  ]},

{ id:"inverse", x:235, y:248, requires:["multiplication","determinant"], methods:["M-04"],
  title:["The inverse","อินเวอร์ส"],
  body:[["A⁻¹ is the matrix satisfying AA⁻¹ = I. For a 2×2 it is the swap-and-negate pattern divided by the determinant, which makes the requirement obvious: divide by zero and nothing exists. A singular matrix has no inverse, full stop.",
         "For larger matrices A⁻¹ = adj(A)/det(A). The property that catches people is (AB)⁻¹ = B⁻¹A⁻¹ — the order reverses, exactly as it did for transposes. Writing A⁻¹B⁻¹ is trap T-02."],
        ["A⁻¹ คือเมทริกซ์ที่ทำให้ AA⁻¹ = I สำหรับ 2×2 มันคือรูปแบบสลับและใส่เครื่องหมายลบ แล้วหารด้วยดีเทอร์มิแนนต์ ซึ่งทำให้เงื่อนไขชัดเจน หารด้วยศูนย์แล้วไม่มีอะไรเหลือ เมทริกซ์เอกฐานไม่มีอินเวอร์ส จบ",
         "สำหรับเมทริกซ์ที่ใหญ่กว่า A⁻¹ = adj(A)/det(A) สมบัติที่ดักคนคือ (AB)⁻¹ = B⁻¹A⁻¹ ลำดับกลับด้าน เหมือนกับที่เกิดกับทรานสโพส การเขียน A⁻¹B⁻¹ คือกับดัก T-02"]],
  formula:["A⁻¹ = adj(A) / det(A)        (AB)⁻¹ = B⁻¹A⁻¹","A⁻¹ = adj(A) / det(A)        (AB)⁻¹ = B⁻¹A⁻¹"],
  flabel:["Order reverses, as with transposes","ลำดับกลับด้าน เหมือนทรานสโพส"],
  viz:"bars",
  vizcfg:{
    title:["THE DETERMINANT DECIDES EVERYTHING","ดีเทอร์มิแนนต์ตัดสินทุกอย่าง"],
    ylab:["value","ค่า"],

      {k:"c", lab:["c","c"], min:-6, max:6, step:1, def:2, unit:""},
      {k:"d", lab:["d","d"], min:-6, max:6, step:1, def:4, unit:""}
    ],
    readouts:[

      {lab:["Determinant zero means","ดีเทอร์มิแนนต์เป็นศูนย์แปลว่า"], f:function(){
        return L()?"พื้นที่ยุบเป็นศูนย์ — ย้อนกลับไม่ได้":"area collapses to nothing — you cannot undo it"; }}

  },
  guide:[

{ id:"systems", x:235, y:346, requires:["inverse"], methods:["M-05","M-06"],
  title:["Solving systems","การแก้ระบบสมการ"],
  body:[["Write the system as AX = B, where A holds the coefficients, X the unknowns and B the constants. Then X = A⁻¹B, provided A is invertible.",
         "Cramer's rule gives each unknown directly as a ratio of determinants: replace the relevant column of A with B and divide by det(A). Either way, det(A) = 0 means the system has no unique solution — either none at all, or infinitely many."],
        ["เขียนระบบเป็น AX = B โดย A เก็บสัมประสิทธิ์ X เก็บตัวไม่รู้ค่า และ B เก็บค่าคงที่ จากนั้น X = A⁻¹B โดยมีเงื่อนไขว่า A ต้องหาอินเวอร์สได้",
         "กฎของคราเมอร์ให้ตัวไม่รู้ค่าแต่ละตัวโดยตรงในรูปอัตราส่วนของดีเทอร์มิแนนต์ ให้แทนหลักที่เกี่ยวข้องของ A ด้วย B แล้วหารด้วย det(A) ไม่ว่าจะทางใด det(A) = 0 หมายความว่าระบบไม่มีคำตอบเดียว คือไม่มีคำตอบเลยหรือมีคำตอบมากมายไม่จำกัด"]],
  formula:["AX = B  ⟹  X = A⁻¹B        xᵢ = det(Aᵢ) / det(A)","AX = B  ⟹  X = A⁻¹B        xᵢ = det(Aᵢ) / det(A)"],
  flabel:["det = 0 means no unique solution","det = 0 คือไม่มีคำตอบเดียว"],
  viz:"bars",
  vizcfg:{
    title:["ONE ANSWER, NONE, OR INFINITELY MANY","คำตอบเดียว ไม่มี หรือมีอนันต์"],
    ylab:["value","ค่า"],
    ctrls:[
      {k:"a", lab:["a  (ax + by = e)","a  (ax + by = e)"], min:-6, max:6, step:1, def:2, unit:""},
      {k:"b", lab:["b","b"], min:-6, max:6, step:1, def:3, unit:""},
      {k:"c", lab:["c  (cx + dy = f)","c  (cx + dy = f)"], min:-6, max:6, step:1, def:4, unit:""},
      {k:"d", lab:["d","d"], min:-6, max:6, step:1, def:1, unit:""}
    ],
    readouts:[
      {lab:["Determinant","ดีเทอร์มิแนนต์"], f:function(S){ return fmt2(S.p.a*S.p.d-S.p.b*S.p.c); }},
      {lab:["Number of solutions","จำนวนคำตอบ"], f:function(S){
        var D=S.p.a*S.p.d-S.p.b*S.p.c;
        return Math.abs(D)>1e-9 ? (L()?"หนึ่งคำตอบพอดี":"exactly one")
                                : (L()?"ไม่มีเลย หรือมีอนันต์":"none, or infinitely many"); }},
      {lab:["Geometrically","ในเชิงเรขาคณิต"], f:function(S){
        var D=S.p.a*S.p.d-S.p.b*S.p.c;
        return Math.abs(D)>1e-9 ? (L()?"เส้นสองเส้นตัดกันที่จุดเดียว":"two lines crossing at one point")
                                : (L()?"เส้นขนานกัน หรือทับกันสนิท":"parallel lines, or the very same line"); }},
      {lab:["Which method to use","ใช้วิธีใด"], f:function(S){
        var D=S.p.a*S.p.d-S.p.b*S.p.c;
        return Math.abs(D)>1e-9 ? (L()?"เมทริกซ์ผกผัน หรือกฎของคราเมอร์":"the inverse matrix, or Cramer's rule")
                                : (L()?"ทั้งสองวิธีใช้ไม่ได้":"neither method works"); }}
    ],
    bars:[
      {lab:["Slope of line 1","ความชันเส้นที่ 1"], f:function(p){ return Math.abs(p.b)<1e-9?0:-p.a/p.b; }, col:"accent"},
      {lab:["Slope of line 2","ความชันเส้นที่ 2"], f:function(p){ return Math.abs(p.d)<1e-9?0:-p.c/p.d; }, col:"good"},
      {lab:["Determinant","ดีเทอร์มิแนนต์"], f:function(p){ return p.a*p.d-p.b*p.c; }, col:"warn"}
    ],
    note:["equal slopes mean parallel lines, and a determinant of zero says exactly that","ความชันเท่ากันแปลว่าเส้นขนาน และดีเทอร์มิแนนต์ที่เป็นศูนย์บอกอย่างนั้นพอดี"]
  } }

var STR = {};
for(var bk in BASE) STR[bk]=BASE[bk];
if(CHAPTER.str) for(var ck in CHAPTER.str) STR[ck]=CHAPTER.str[ck];
function L(){ return STATE.lang==="th"?1:0; }
function t(k){ var e=STR[k]; return e?e[L()]:k; }
function tx(pair){ return Array.isArray(pair)?pair[L()]:pair; }
function esc(v){ return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                        .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- 2 · helpers ---------- */
function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function fmt(n){ return (Math.round(n*10)/10).toString(); }
function fmt2(n){ return (Math.round(n*100)/100).toString(); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function niceStep(range,target){
  if(!(range>0)) return 1;
  var raw=range/target, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), n=raw/mag;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
}
function tk(n){ var r=Math.round(n*100)/100; return (Math.abs(r)<1e-9?0:r).toString(); }
var FT='fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="10"';

/* Shared, fully scaled axis frame. Returns mapping functions. */
function axes(o,c){
  var X=function(v){ return c.x + (v-c.xmin)/(c.xmax-c.xmin)*c.w; };
  var Y=function(v){ return c.y + c.h - (v-c.ymin)/(c.ymax-c.ymin)*c.h; };
  /* title / xlab / ylab accept either a plain string or an ["EN","TH"] pair */
  if(c.title) o.push('<text x="'+c.x+'" y="'+(c.y-22)+'" fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="10.5" letter-spacing="1.4">'+tx(c.title)+'</text>');
  var ys=niceStep(c.ymax-c.ymin,c.yticks||5), y0v=Math.ceil(c.ymin/ys)*ys;
  for(var i=0;c.yticks!==0 && i<=Math.floor((c.ymax-y0v)/ys+1e-9);i++){
    var vv=y0v+i*ys, gy=Y(vv);
    o.push('<line x1="'+c.x+'" y1="'+gy+'" x2="'+(c.x+c.w)+'" y2="'+gy+'" stroke="var(--rule)" stroke-width="1"/>');
    o.push('<line x1="'+(c.x-5)+'" y1="'+gy+'" x2="'+c.x+'" y2="'+gy+'" stroke="var(--ink-faint)" stroke-width="1"/>');
    o.push('<text x="'+(c.x-9)+'" y="'+(gy+3.5)+'" '+FT+' text-anchor="end">'+tk(vv)+'</text>');
  }
  var xs=niceStep(c.xmax-c.xmin,c.xticks||5), x0v=Math.ceil(c.xmin/xs)*xs;
  for(var j=0;c.xticks!==0 && j<=Math.floor((c.xmax-x0v)/xs+1e-9);j++){
    var uu=x0v+j*xs, gx=X(uu);
    o.push('<line x1="'+gx+'" y1="'+c.y+'" x2="'+gx+'" y2="'+(c.y+c.h)+'" stroke="var(--rule)" stroke-width="1"/>');
    o.push('<line x1="'+gx+'" y1="'+(c.y+c.h)+'" x2="'+gx+'" y2="'+(c.y+c.h+5)+'" stroke="var(--ink-faint)" stroke-width="1"/>');
    o.push('<text x="'+gx+'" y="'+(c.y+c.h+19)+'" '+FT+' text-anchor="middle">'+tk(uu)+'</text>');
  }
  var zy = (c.ymin<0&&c.ymax>0) ? Y(0) : c.y+c.h;
  o.push('<line x1="'+c.x+'" y1="'+c.y+'" x2="'+c.x+'" y2="'+(c.y+c.h)+'" stroke="var(--ink-faint)" stroke-width="1.6"/>');
  o.push('<line x1="'+c.x+'" y1="'+zy+'" x2="'+(c.x+c.w)+'" y2="'+zy+'" stroke="var(--ink-faint)" stroke-width="1.6"/>');
  if(c.ylab) o.push('<text transform="rotate(-90 15 '+(c.y+c.h/2)+')" x="15" y="'+(c.y+c.h/2)+'" '+FT+' text-anchor="middle">'+tx(c.ylab)+'</text>');
  if(c.xlab) o.push('<text x="'+(c.x+c.w)+'" y="'+(c.y+c.h+36)+'" '+FT+' text-anchor="end">'+tx(c.xlab)+'</text>');
  return { X:X, Y:Y, zy:zy };
}

/* Caption inside a visualizer. ALWAYS takes an ["EN","TH"] pair, so no drawing
   can quietly ship English-only text. o=out array, kind picks the styling. */
function cap(o,x,y,pair,kind){
  var st = kind==="eyebrow"
      ? 'fill="var(--ink-faint)" font-size="10" letter-spacing="1.4"'
    : kind==="note"
      ? 'fill="var(--ink-faint)" font-size="10"'
    : kind==="accent"
      ? 'fill="var(--accent)" font-size="11"'
    : kind==="good"
      ? 'fill="var(--good)" font-size="10.5"'
    : kind==="strong"
      ? 'fill="var(--ink)" font-size="11.5" font-weight="600"'
      : 'fill="var(--ink-soft)" font-size="10.5"';
  var anchor = kind==="mid" ? ' text-anchor="middle"' : kind==="end" ? ' text-anchor="end"' : '';
  if(kind==="mid"||kind==="end") st='fill="var(--ink-soft)" font-size="10.5"';
  o.push('<text x="'+x+'" y="'+y+'" '+st+' font-family="IBM Plex Sans"'+anchor+'>'+tx(pair)+'</text>');
}

    o.push('<line x1="58" y1="'+ny+'" x2="'+nx+'" y2="'+ny+'" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/>');
    o.push('<circle cx="'+nx+'" cy="'+ny+'" r="4.5" fill="var(--accent)"/>');

/* PLOT — generic scaled y = f(x) plotter. Node supplies fn, ranges, labels. */
VIZLIB.plot = {
  vb:"0 0 560 300", anim:false,

    {lab:["Resultant R","ผลลัพธ์ R"], f:function(S){

      var ry=p.A*Math.sin(p.tA*Math.PI/180)+p.B*Math.sin(p.tB*Math.PI/180);
      return fmt(Math.sqrt(rx*rx+ry*ry)); }},
    {lab:["Direction","ทิศทาง"], f:function(S){
      var p=S.p, rx=p.A*Math.cos(p.tA*Math.PI/180)+p.B*Math.cos(p.tB*Math.PI/180);
      var ry=p.A*Math.sin(p.tA*Math.PI/180)+p.B*Math.sin(p.tB*Math.PI/180);

  draw:function(S,o){

    var bx=p.B*Math.cos(p.tB*Math.PI/180), by=p.B*Math.sin(p.tB*Math.PI/180);

    for(var g=-20;g<=20;g+=5){

VIZLIB.bars = {
  vb:"0 0 560 300", anim:false,
  draw:function(S,o,cfg){
    var B=cfg.bars.map(function(b){ return {lab:b.lab, v:b.f(S.p), c:col(b.col)}; });
    var vs=B.map(function(b){ return b.v; });
    var hi=Math.max.apply(null,vs.concat([0])), lo=Math.min.apply(null,vs.concat([0]));
    if(cfg.ymax!=null) hi=cfg.ymax;
    if(cfg.ymin!=null) lo=cfg.ymin;

    var n=B.length, A=axes(o,{x:64,y:54,w:452,h:184,xmin:0,xmax:n,ymin:lo,ymax:hi,
                             title:cfg.title, ylab:cfg.ylab, xticks:0, yticks:5});
    var w=452/n, bw=Math.min(74,w*0.56);

/* TRI — a triangle drawn to scale from two sides and the included angle */
VIZLIB.tri = {
  vb:"0 0 560 300", anim:false,
  draw:function(S,o,cfg){
    var g=cfg.sides(S.p), a=g.a, b=g.b, C=g.C*Math.PI/180;
    var c=Math.sqrt(a*a+b*b-2*a*b*Math.cos(C));
    var A1=Math.asin(Math.min(1,a*Math.sin(C)/(c||1)));
    var B1=Math.PI-C-A1;
    /* place C at origin, b along +x, a at angle C */
    var P={ C:[0,0], A:[b,0], B:[a*Math.cos(C), a*Math.sin(C)] };
    var xs=[P.C[0],P.A[0],P.B[0]], ys=[P.C[1],P.A[1],P.B[1]];
    var mnx=Math.min.apply(null,xs), mxx=Math.max.apply(null,xs);
    var mny=Math.min.apply(null,ys), mxy=Math.max.apply(null,ys);
    var sc=Math.min(360/Math.max(1e-6,mxx-mnx), 170/Math.max(1e-6,mxy-mny));
    var ox=150-mnx*sc, oy=230+mny*sc;
    var T=function(p){ return [ox+p[0]*sc, oy-p[1]*sc]; };
    var tC=T(P.C), tA=T(P.A), tB=T(P.B);
    if(cfg.title) cap(o,44,40,cfg.title,"eyebrow");
    o.push('<path d="M'+tC[0]+' '+tC[1]+' L'+tA[0]+' '+tA[1]+' L'+tB[0]+' '+tB[1]+
           ' Z" fill="var(--accent)" fill-opacity="0.10" stroke="var(--ink)" stroke-width="2.2"/>');
    function side(p,q,lab,val,c2){
      o.push('<text x="'+((p[0]+q[0])/2)+'" y="'+((p[1]+q[1])/2-6)+'" fill="'+c2+
             '" font-family="IBM Plex Sans" font-size="11" text-anchor="middle">'+lab+' = '+fmt2(val)+'</text>');
    }
    side(tC,tA,"b",b,"var(--ink-soft)");
    side(tC,tB,"a",a,"var(--ink-soft)");
    side(tA,tB,"c",c,"var(--accent)");
    [[tC,"C",g.C],[tA,"A",A1*180/Math.PI],[tB,"B",B1*180/Math.PI]].forEach(function(v){
      o.push('<circle cx="'+v[0][0]+'" cy="'+v[0][1]+'" r="3.5" fill="var(--ink)"/>');
      o.push('<text x="'+(v[0][0]-14)+'" y="'+(v[0][1]+14)+'" fill="var(--ink)" font-family="IBM Plex Sans" '+
             'font-size="10.5" font-weight="600">'+v[1]+' '+fmt(v[2])+'°</text>');
    });
    var area=0.5*a*b*Math.sin(C);
    o.push('<text x="404" y="86" fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="10" letter-spacing="1.2">'+
           tx(["THIRD SIDE","ด้านที่สาม"])+'</text>');
    o.push('<text x="404" y="118" fill="var(--accent)" font-family="Bodoni Moda, serif" font-size="30">'+fmt2(c)+'</text>');
    o.push('<text x="404" y="152" fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="10" letter-spacing="1.2">'+
           tx(["AREA ½ ab sin C","พื้นที่ ½ ab sin C"])+'</text>');
    o.push('<text x="404" y="182" fill="var(--ink)" font-family="Bodoni Moda, serif" font-size="26">'+fmt2(area)+'</text>');
    if(cfg.note) cap(o,44,286,cfg.note,"note");
  }
};

var FR = { qy:22, sx:30, sw:500, sy:34, ground:214, div:250,
           iy:268, ih:144, ix:64, iw:462 };

/* A dimension line with end ticks and a centred label. Used constantly. */
function dim(o, x1, x2, y, pair, c){
  c = c || "var(--ink-soft)";
  if(Math.abs(x2-x1) < 2) return;
  o.push('<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+c+'" stroke-width="1.3"/>');
  [x1,x2].forEach(function(x){
    o.push('<line x1="'+x+'" y1="'+(y-4)+'" x2="'+x+'" y2="'+(y+4)+'" stroke="'+c+'" stroke-width="1.3"/>');
  });
  if(pair) o.push('<text x="'+((x1+x2)/2)+'" y="'+(y-7)+'" fill="'+c+
                  '" font-family="IBM Plex Sans" font-size="10.5" text-anchor="middle">'+tx(pair)+'</text>');
}

/* Thai has no word spaces, so long labels shrink rather than wrap. */
function fitText(o, x, y, pair, maxw, size, c, anchor){
  var s = tx(pair), fs = size;
  var est = s.length * size * 0.56;
  if(est > maxw) fs = Math.max(7.5, size * maxw / est);
  o.push('<text x="'+x+'" y="'+y+'" fill="'+(c||"var(--ink-soft)")+
         '" font-family="IBM Plex Sans" font-size="'+fmt2(fs)+'"'+
         (anchor?' text-anchor="'+anchor+'"':'')+'>'+s+'</text>');
}

/* A gauge arc with a needle, for the `dial` instrument. */
function needle(o, cx, cy, r, frac, pair, unit){
  var a0 = Math.PI*0.82, a1 = Math.PI*0.18;
  function pt(a, rr){ return [cx+Math.cos(a)*rr, cy-Math.sin(a)*rr]; }
  var p0=pt(a0,r), p1=pt(a1,r);
  o.push('<path d="M'+fmt2(p0[0])+' '+fmt2(p0[1])+' A'+r+' '+r+' 0 0 1 '+fmt2(p1[0])+' '+fmt2(p1[1])+
         '" fill="none" stroke="var(--rule)" stroke-width="7"/>');
  var f = Math.max(0, Math.min(1, frac));
  var ae = a0 + (a1-a0)*f, pe=pt(ae,r);
  o.push('<path d="M'+fmt2(p0[0])+' '+fmt2(p0[1])+' A'+r+' '+r+' 0 0 1 '+fmt2(pe[0])+' '+fmt2(pe[1])+
         '" fill="none" stroke="var(--accent)" stroke-width="7"/>');
  var tip=pt(ae, r-9);
  o.push('<line x1="'+cx+'" y1="'+cy+'" x2="'+fmt2(tip[0])+'" y2="'+fmt2(tip[1])+
         '" stroke="var(--ink)" stroke-width="2.4"/>');
  o.push('<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="var(--ink)"/>');
  if(pair) o.push('<text x="'+cx+'" y="'+(cy+20)+'" fill="var(--ink-faint)" font-family="IBM Plex Sans" '+
                  'font-size="10" text-anchor="middle">'+tx(pair)+'</text>');
  if(unit!=null) o.push('<text x="'+cx+'" y="'+(cy-14)+'" fill="var(--ink)" font-family="Bodoni Moda, serif" '+
                        'font-size="19" text-anchor="middle">'+unit+'</text>');
}

/* ROAD — a street with distance markers, props and vehicles.

/* ---------- instrument band ---------- */

function instrument(S, o, ins, ctx){
  if(!ins) return null;
  var k = ins.kind || "graph";

  if(k === "graph"){
    var N=140, xs=[], ys=[], i;
    for(i=0;i<=N;i++){ var x=ins.xmin+(ins.xmax-ins.xmin)*i/N; xs.push(x); ys.push(ins.fn(x,S.p,S)); }
    var hi=Math.max.apply(null,ys.concat([0])), lo=Math.min.apply(null,ys.concat([0]));
    if(ins.ymin!=null) lo=ins.ymin;
    if(ins.ymax!=null) hi=ins.ymax;
    var pad=Math.max(.4,(hi-lo)*0.16); hi+=pad; if(lo<0) lo-=pad;
    var A=axes(o,{x:FR.ix,y:FR.iy,w:FR.iw,h:FR.ih,xmin:ins.xmin,xmax:ins.xmax,ymin:lo,ymax:hi,
                  xlab:ins.xlab, ylab:ins.ylab, xticks:ins.xticks, yticks:ins.yticks});
    var d="";
    for(i=0;i<=N;i++) d+=(i?" L":"M")+fmt2(A.X(xs[i]))+" "+fmt2(A.Y(ys[i]));
    /* the fill may stop short of the curve, so the area can be watched growing */
    if(ins.fill){
      var upto = ins.upto ? ins.upto(S.p,S) : ins.xmax;
      upto = Math.max(ins.xmin, Math.min(ins.xmax, upto));
      var fd="";
      for(i=0;i<=N;i++){
        var fx=ins.xmin+(upto-ins.xmin)*i/N;
        fd+=(i?" L":"M")+fmt2(A.X(fx))+" "+fmt2(A.Y(ins.fn(fx,S.p,S)));
      }
      if(upto>ins.xmin)
        o.push('<path d="'+fd+' L'+fmt2(A.X(upto))+' '+fmt2(A.zy)+' L'+fmt2(A.X(ins.xmin))+' '+
               fmt2(A.zy)+' Z" fill="var(--accent)" fill-opacity=".14"/>');
    }
    o.push('<path d="'+d+'" stroke="var(--accent)" stroke-width="2.4" fill="none"/>');
    if(ins.mark!=null){
      var mx=ins.mark(S.p,S), my=ins.fn(mx,S.p,S);
      o.push('<line x1="'+fmt2(A.X(mx))+'" y1="'+fmt2(A.Y(my))+'" x2="'+fmt2(A.X(mx))+'" y2="'+fmt2(A.zy)+
             '" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>');
      o.push('<circle cx="'+fmt2(A.X(mx))+'" cy="'+fmt2(A.Y(my))+'" r="4.5" fill="var(--accent)"/>');
      return { X:A.X, markX:A.X(mx) };
    }
    return { X:A.X };
  }

  if(k === "bar"){
    var B=ins.bars.map(function(b){ return {lab:b.lab, v:b.f(S.p,S), c:col(b.col)}; });
    var vs=B.map(function(b){ return b.v; });
    var h2=Math.max.apply(null,vs.concat([0])), l2=Math.min.apply(null,vs.concat([0]));
    if(ins.ymax!=null) h2=ins.ymax;
    var pd=Math.max(1e-6,(h2-l2)*0.2); h2+=pd; if(l2<0) l2-=pd;
    var A2=axes(o,{x:FR.ix,y:FR.iy,w:FR.iw,h:FR.ih-18,xmin:0,xmax:B.length,ymin:l2,ymax:h2,
                   ylab:ins.ylab, xticks:0, yticks:4});
    var w=FR.iw/B.length, bw=Math.min(66,w*0.5);
    B.forEach(function(b,j){
      var cx=A2.X(j+0.5), y0=A2.Y(0), y1=A2.Y(b.v);
      o.push('<rect x="'+fmt2(cx-bw/2)+'" y="'+fmt2(Math.min(y0,y1))+'" width="'+fmt2(bw)+
             '" height="'+fmt2(Math.abs(y1-y0))+'" fill="'+b.c+'" opacity=".9"/>');
      o.push('<text x="'+fmt2(cx)+'" y="'+fmt2(y1+(b.v<0?14:-7))+'" fill="var(--ink)" '+
             'font-family="IBM Plex Sans" font-size="11" font-weight="600" text-anchor="middle">'+fmt2(b.v)+'</text>');
      fitText(o, cx, A2.Y(l2)+32, b.lab, w-6, 10, "var(--ink-soft)", "middle");
    });
    return null;
  }

  if(k === "strip"){
    var P=ins.parts(S.p,S);
    var tot=P.reduce(function(a,q){ return a+Math.max(0,q.v); },0)||1;
    var x0=FR.ix, w2=FR.iw, y=FR.iy+26, hh=48, x=x0;
    P.forEach(function(q){
      var pw=Math.max(0,q.v)/tot*w2;
      o.push('<rect x="'+fmt2(x)+'" y="'+y+'" width="'+fmt2(pw)+'" height="'+hh+'" fill="'+col(q.col)+'" opacity=".88"/>');
      if(pw>36) o.push('<text x="'+fmt2(x+pw/2)+'" y="'+(y+hh/2+4)+'" fill="#fff" font-family="IBM Plex Sans" '+
                       'font-size="11" font-weight="600" text-anchor="middle">'+fmt2(q.v)+'</text>');
      x+=pw;
    });
    o.push('<rect x="'+x0+'" y="'+y+'" width="'+w2+'" height="'+hh+'" fill="none" stroke="var(--ink)" stroke-width="1.6"/>');
    P.forEach(function(q,j){
      var lx=x0+(j%3)*158, ly=y+hh+26+Math.floor(j/3)*19;
      o.push('<rect x="'+lx+'" y="'+(ly-9)+'" width="11" height="11" fill="'+col(q.col)+'"/>');
      fitText(o, lx+17, ly, q.lab, 132, 10.5, "var(--ink-soft)");
    });
    return null;
  }

  if(k === "dial"){
    needle(o, FR.ix+FR.iw/2, FR.iy+104, 78, ins.frac(S.p,S), ins.lab, ins.value(S.p,S));
    return null;
  }
  return null;
}

/* ---------- 3.5 · art layer ----------

   Raster and vector art that decorates a visualizer, per the asset contract in
   Project Concept 9 and the body-and-clothes rule in 4:

     - art lives beside the package at  assets/ch<NN>/<name>.<ext>  and is never
       inlined, so the HTML stays the unit of distribution
     - the page must work with assets/ deleted, so every reference is optional
       and a failed load leaves the scene drawn and the lesson intact
     - no meaning may live only in an image: captions and hotspot labels are
       SVG <text> from [en,th] pairs on the layer above, so they translate

   Art sits on its own <svg>, drawn once, behind the scene layer that redraws
   every frame. That keeps an animating visualizer from re-parsing the image
   sixty times a second, and keeps the picture still while the labels move. */

var ART = {
  base: function(){ return "assets/ch" + (CHAPTER.num || "00") + "/"; },
  seen: {},                                  /* src -> "wait" | "ok" | "gone" */

  url: function(src){
    return /^(?:[a-z]+:|\/|\.)/i.test(src) ? src : ART.base() + src;
  },

  /* Ask for a file once. Load and failure both redraw, so the first paint can
     go ahead without waiting and the picture drops in when it arrives. */
  ask: function(src){
    var u = ART.url(src);
    if(ART.seen[u]) return ART.seen[u];
    ART.seen[u] = "wait";
    var im = new Image();
    im.onload  = function(){ ART.seen[u] = "ok";   ART.repaint(); };
    im.onerror = function(){ ART.seen[u] = "gone"; ART.repaint(); };
    im.src = u;
    return "wait";
  },

  ready: function(src){ return ART.ask(src) === "ok"; },

  dark: function(){
    var m = document.documentElement.getAttribute("data-theme");
    if(m) return m === "dark";
    return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  },

  /* Which file to show, and how, for the theme in force.

     11.5 relieves the artist of any dark-matting duty: assets may assume a
     light ground. The consequence lands here instead - a light-ground plate
     dropped on the dark theme reads as a grey slab. So on dark the engine
     shows an authored dark variant if there is one, inverts a texture that
     says it may be inverted, and otherwise shows nothing. Hiding is the safe
     default because inverting real artwork would misrepresent it, and a
     missing decoration is a state the page is already required to survive. */
  pick: function(a){
    if(!a || !a.src) return null;
    if(!ART.dark()) return { src: a.src, cls: "" };
    if(a.srcDark)   return { src: a.srcDark, cls: "" };
    if(a.dark === "invert") return { src: a.src, cls: "art-invert" };
    if(a.dark === "as-is")  return { src: a.src, cls: "" };
    return null;
  },

  repaint: function(){
    if(typeof LABS === "undefined") return;
    LABS.forEach(function(l){ if(l.repaintArt) l.repaintArt(); });
  },

  /* One <image>, or nothing at all if the file is absent. `fit` follows
     preserveAspectRatio; the default letterboxes rather than distorts. */
  tag: function(a, vb){
    var use = ART.pick(a);
    if(!use || !ART.ready(use.src)) return "";
    var box = ART.box(a, vb);
    return '<image class="' + use.cls + '" href="' + esc(ART.url(use.src)) + '"' +
           ' x="' + box.x + '" y="' + box.y +
           '" width="' + box.w + '" height="' + box.h + '"' +
           ' preserveAspectRatio="' + (a.fit || "xMidYMid meet") + '"' +
           (a.opacity != null ? ' opacity="' + a.opacity + '"' : "") +
           ' aria-hidden="true"/>';
  },

  /* Default to filling the visualizer's own viewBox, so a decorating image
     needs nothing but a filename. */
  box: function(a, vb){
    var v = (vb || "0 0 560 340").split(/\s+/);
    return { x: a.x != null ? a.x : +v[0], y: a.y != null ? a.y : +v[1],
             w: a.w != null ? a.w : +v[2], h: a.h != null ? a.h : +v[3] };
  }
};


/* A plate: the artwork is the scene. Labels sit over it as real text, so the
   plate still says what it means when the file is missing or the reader
   switches language. */
VIZLIB.plate = {
  vb: "0 0 560 340",
  draw: function(S, o, cfg){
    var vb = (cfg && cfg.vb) || VIZLIB.plate.vb,
        v = vb.split(/\s+/), w = +v[2], h = +v[3],
        use = cfg && ART.pick(cfg.art), on = use && ART.ready(use.src), art = cfg && cfg.art;
    /* Plates are framed with a hairline whether or not the art loaded - the
       frame is the house style, not a broken-image marker. */
    o.push('<rect x="0.5" y="0.5" width="' + (w - 1) + '" height="' + (h - 1) +
           '" fill="none" stroke="var(--rule)" stroke-width="1"/>');
    if(!on && art)
      o.push('<text x="' + (w / 2) + '" y="' + (h / 2) +
             '" fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="11"' +
             ' text-anchor="middle">' + esc(tx(art.alt || ["", ""])) + '</text>');
    (cfg && cfg.labels || []).forEach(function(L){
      var anc = L.anchor || "middle";
      if(L.pin)
        o.push('<circle cx="' + L.pin[0] + '" cy="' + L.pin[1] + '" r="2.5" fill="var(--ink)"/>' +
               '<line x1="' + L.pin[0] + '" y1="' + L.pin[1] + '" x2="' + L.x + '" y2="' + L.y +
               '" stroke="var(--ink)" stroke-width="1" opacity=".45"/>');
      o.push('<text x="' + L.x + '" y="' + L.y + '" text-anchor="' + anc +
             '" fill="var(--ink)" font-family="IBM Plex Sans" font-size="11"' +
             ' font-weight="600" paint-order="stroke"' +
             ' stroke="var(--ground)" stroke-width="3" stroke-linejoin="round">' +
             esc(tx(L.text)) + '</text>');
    });
  }
};

/* ---------- 4 · map ---------- */
var NW=150, NH=38;
function node(id){ for(var i=0;i<CHAPTER.nodes.length;i++) if(CHAPTER.nodes[i].id===id) return CHAPTER.nodes[i]; return null; }
function methodMastered(m){ var c=STATE.cov[m]; if(!c) return false; for(var k in c) if(c[k]>0) return true; return false; }
function stateOf(id){
  var n=node(id);
  if(STATE.read[id]){
    if(n.methods && n.methods.length){
      var all=true;
      for(var i=0;i<n.methods.length;i++) if(!methodMastered(n.methods[i])) all=false;
      if(all) return "trained";
    }
    return "read";
  }
  var req=n.requires||[];
  for(var j=0;j<req.length;j++) if(!STATE.read[req[j]]) return "upcoming";
  return "available";
}
/* Orthogonal edge routing for the chapter map.

   Nodes sit on a fixed grid (columns 135 apart, rows 98 apart) but the boxes
   are 150 wide, so neighbouring columns overlap and there is no vertical
   corridor between them. Routes are therefore planned against the nodes that
   actually exist rather than against the grid: a candidate is accepted only
   once every one of its segments has been checked clear of every node that is
   not its own endpoint.

   The earlier version drew one cubic Bezier per edge from the parent's
   bottom-centre to the child's top-centre, which put every edge of a node on
   the same attach point and let a curve cut straight through whatever sat
   between the two rows. */
var EDGE_CH = 30;   /* channel offset from a row edge; rows are 60px apart   */
var EDGE_R  = 8;    /* elbow radius                                          */
var EDGE_GAP = 8;   /* clearance required when testing a route against a box */

function mapRect(n) {
  return { x0: n.x - NW / 2, x1: n.x + NW / 2, y0: n.y - NH / 2, y1: n.y + NH / 2 };
}

/* Does this axis-aligned segment run through any node that is not an endpoint? */
function segClear(p, q, skip) {
  var i, r, x0 = Math.min(p[0], q[0]), x1 = Math.max(p[0], q[0]),
      y0 = Math.min(p[1], q[1]), y1 = Math.max(p[1], q[1]);
  for (i = 0; i < CHAPTER.nodes.length; i++) {
    if (skip.indexOf(CHAPTER.nodes[i].id) >= 0) continue;
    r = mapRect(CHAPTER.nodes[i]);
    if (x1 > r.x0 - EDGE_GAP && x0 < r.x1 + EDGE_GAP &&
        y1 > r.y0 - EDGE_GAP && y0 < r.y1 + EDGE_GAP) return false;
  }
  return true;
}

function ptsClear(pts, skip) {
  for (var i = 0; i < pts.length - 1; i++)
    if (!segClear(pts[i], pts[i + 1], skip)) return false;
  return true;
}

/* Fanned attach points: k-th of n along an edge of the box, never shared. */
function attach(n, side, k, total) {
  var r = mapRect(n), t = (k + 1) / (total + 1);
  if (side === "bottom") return [r.x0 + NW * t, r.y1];
  if (side === "top")    return [r.x0 + NW * t, r.y0];
  if (side === "right")  return [r.x1, r.y0 + NH * t];
  return [r.x0, r.y0 + NH * t];
}

function routeEdge(p, n, pk, pn, nk, nn) {
  var skip = [p.id, n.id], a, b, cand = [], i;
  if (p.y === n.y) {                                   /* same row, sideways */
    var right = n.x > p.x;
    a = attach(p, right ? "right" : "left", pk, pn);
    b = attach(n, right ? "left" : "right", nk, nn);
    if (a[1] === b[1]) return [a, b];
    var mx = (a[0] + b[0]) / 2;
    return [a, [mx, a[1]], [mx, b[1]], b];
  }
  a = attach(p, "bottom", pk, pn);
  b = attach(n, "top", nk, nn);
  if (a[0] === b[0]) cand.push([a, b]);                /* straight down      */
  cand.push([a, [a[0], a[1] + EDGE_CH], [b[0], a[1] + EDGE_CH], b]);   /* high */
  cand.push([a, [a[0], b[1] - EDGE_CH], [b[0], b[1] - EDGE_CH], b]);   /* low  */
  for (i = 0; i < cand.length; i++)
    if (ptsClear(cand[i], skip)) return cand[i];
  /* Both channels blocked: drop out to a side corridor and come back in. */
  var xs = [24, NW / 2 - 24, 470 - 24], best = null;
  for (i = 0; i < xs.length; i++) {
    var route = [a, [a[0], a[1] + EDGE_CH], [xs[i], a[1] + EDGE_CH],
                 [xs[i], b[1] - EDGE_CH], [b[0], b[1] - EDGE_CH], b];
    if (ptsClear(route, skip)) { best = route; break; }
  }
  return best || cand[1];
}

/* Two connectors may share a channel only if their spans do not touch. Where
   they do - most often two edges leaving the same box for different rows - the
   later one is nudged onto its own line so neither hides the other. */
function laneChannels(list){
  var runs=[], i, j, e;
  for(i=0;i<list.length;i++){
    e=list[i];
    for(j=1;j<e.pts.length-2;j++){
      if(e.pts[j][1]===e.pts[j+1][1] && e.pts[j][0]!==e.pts[j+1][0])
        runs.push({e:e,i:j,y:e.pts[j][1],
                   x0:Math.min(e.pts[j][0],e.pts[j+1][0]),
                   x1:Math.max(e.pts[j][0],e.pts[j+1][0])});
    }
  }
  var by={};
  runs.forEach(function(r){ (by[r.y]=by[r.y]||[]).push(r); });
  var off=[0,-12,12,-24,24];
  Object.keys(by).forEach(function(y){
    var g=by[y].sort(function(a,b){ return a.x0-b.x0; }), ends=[];
    g.forEach(function(r){
      var k=0;
      while(k<ends.length && r.x0 < ends[k]-0.5) k++;
      if(k===ends.length) ends.push(r.x1); else ends[k]=r.x1;
      var d=off[Math.min(k,off.length-1)];
      if(d){ r.e.pts[r.i][1]+=d; r.e.pts[r.i+1][1]+=d; }
    });
  });
}

/* Polyline -> path with quarter-arc corners, shrinking the radius on short legs. */
function edgePath(pts) {
  var d = "M" + pts[0][0] + " " + pts[0][1], i;
  function sgn(v) { return v > 0 ? 1 : (v < 0 ? -1 : 0); }
  for (i = 1; i < pts.length - 1; i++) {
    var p = pts[i - 1], c = pts[i], q = pts[i + 1],
        d1x = sgn(c[0] - p[0]), d1y = sgn(c[1] - p[1]),
        d2x = sgn(q[0] - c[0]), d2y = sgn(q[1] - c[1]);
    if (d1x === d2x && d1y === d2y) continue;
    var r = Math.min(EDGE_R,
                     (Math.abs(c[0] - p[0]) + Math.abs(c[1] - p[1])) / 2,
                     (Math.abs(q[0] - c[0]) + Math.abs(q[1] - c[1])) / 2);
    if (r < 1) continue;
    var sweep = (d1x * d2y - d1y * d2x) > 0 ? 1 : 0;
    d += " L" + (c[0] - d1x * r) + " " + (c[1] - d1y * r) +
         " A" + r + " " + r + " 0 0 " + sweep + " " +
         (c[0] + d2x * r) + " " + (c[1] + d2y * r);
  }
  return d + " L" + pts[pts.length - 1][0] + " " + pts[pts.length - 1][1];
}

function drawMap(){
  var E=document.getElementById("edges"), N=document.getElementById("nodes");
  E.innerHTML=""; N.innerHTML="";
  /* Count what leaves and enters each box first, so every connector on one
     edge of a box gets its own attach point instead of sharing the centre. */
  var out={}, inc={}, list=[];
  CHAPTER.nodes.forEach(function(n){
    (n.requires||[]).forEach(function(r){
      var p=node(r); if(!p) return;
      var os=(p.y===n.y)?(n.x>p.x?"right":"left"):"bottom";
      var is=(p.y===n.y)?(n.x>p.x?"left":"right"):"top";
      out[p.id+os]=(out[p.id+os]||0)+1;
      inc[n.id+is]=(inc[n.id+is]||0)+1;
      list.push({p:p,n:n,os:os,is:is,r:r});
    });
  });
  var oi={}, ii={};
  list.forEach(function(e){
    var ok=e.p.id+e.os, ik=e.n.id+e.is;
    oi[ok]=(ok in oi)?oi[ok]+1:0; ii[ik]=(ik in ii)?ii[ik]+1:0;
    e.pts=routeEdge(e.p,e.n,oi[ok],out[ok],ii[ik],inc[ik]);
  });
  laneChannels(list);
  list.forEach(function(e){
    var path=document.createElementNS("http://www.w3.org/2000/svg","path");
    path.setAttribute("d",edgePath(e.pts));
    path.setAttribute("class","medge"+(STATE.read[e.r]?" lit":""));
    path.setAttribute("marker-end","url(#ah)");
    E.appendChild(path);
  });
  CHAPTER.nodes.forEach(function(n){
    var g=document.createElementNS("http://www.w3.org/2000/svg","g");
    g.setAttribute("class","mnode");
    g.setAttribute("data-state",stateOf(n.id));
    g.setAttribute("data-current",STATE.current===n.id?"1":"0");
    g.setAttribute("tabindex","0"); g.setAttribute("role","button");
    var r=document.createElementNS("http://www.w3.org/2000/svg","rect");
    r.setAttribute("x",n.x-NW/2); r.setAttribute("y",n.y-NH/2);
    r.setAttribute("width",NW); r.setAttribute("height",NH);
    var txt=document.createElementNS("http://www.w3.org/2000/svg","text");
    txt.setAttribute("x",n.x); txt.setAttribute("y",n.y+1);
    txt.textContent=tx(n.title);
    g.appendChild(r); g.appendChild(txt);
    function go(){ var el=document.getElementById("sec-"+n.id); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); }
    g.addEventListener("click",go);
    g.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
    N.appendChild(g);
  });
  var done=0; CHAPTER.nodes.forEach(function(n){ if(STATE.read[n.id]) done++; });
  document.getElementById("progNum").textContent=done;
  document.getElementById("progTot").textContent="/"+CHAPTER.nodes.length;
}

/* ---------- 5 · lab factory ---------- */
var LABS=[];
function makeLab(nd, host){
  var viz = typeof nd.viz==="string" ? VIZLIB[nd.viz] : nd.viz;
  if(!viz) return null;
  var cfg = nd.vizcfg || {};
  var ctrls = viz.ctrls || cfg.ctrls || [];
  var animated = viz.anim || cfg.anim;   /* cfg wins for shared builders */
  var readouts = viz.readouts || cfg.readouts || [];

  var h='<div class="lab-head"><span class="label accent">'+t("lab.title")+'</span>'+
        '<div class="lab-mode"><button class="btn m-guided" type="button">'+t("lab.guided")+'</button>'+
        '<button class="btn m-sandbox" type="button">'+t("lab.sandbox")+'</button></div></div>'+
        '<div class="lab-stage">'+
          '<svg class="labart" viewBox="'+viz.vb+'" aria-hidden="true" focusable="false"></svg>'+
          '<svg class="labsvg" viewBox="'+viz.vb+'" role="img" aria-label="visualizer"></svg>'+
        '</div>'+
        (cfg.caption?'<figcaption class="lab-cap">'+esc(tx(cfg.caption))+'</figcaption>':'')+
        '<div class="lab-body">'+
        '<div class="guide"><span class="step g-step"></span><p class="g-text"></p></div>'+
        '<div class="transport g-nav"><button class="btn g-prev" type="button">'+t("lab.prev")+'</button>'+
        '<button class="btn g-next" type="button">'+t("lab.next")+'</button>'+
        '<button class="btn g-skip" type="button">'+t("lab.skip")+'</button></div><div class="ctrls">';
  ctrls.forEach(function(c,i){
    h+='<div class="ctrl"><label><span>'+tx(c.lab)+'</span><span class="lv" data-i="'+i+'"></span></label>'+
       '<input type="range" class="cv" data-i="'+i+'" min="'+c.min+'" max="'+c.max+'" step="'+c.step+'" value="'+c.def+'"></div>';
  });
  h+='</div>';
  if(animated) h+='<div class="transport"><button class="btn b-play" type="button">'+t("lab.play")+'</button>'+
                  '<button class="btn b-rew" type="button">'+t("lab.reset")+'</button></div>';
  if(readouts.length){
    h+='<div class="readouts">';
    readouts.forEach(function(r,i){ h+='<div class="ro"><b>'+tx(r.lab)+'</b><span class="rv" data-i="'+i+'"></span></div>'; });
    h+='</div>';
  }
  h+='</div>';
  host.className="lab"; host.innerHTML=h;

  var S={p:{},t:0,playing:false,mode:"sandbox",step:0,script:nd.guide||null,raf:null};
  ctrls.forEach(function(c){ S.p[c.k]=c.def; });
  var q=function(s){ return host.querySelector(s); };
  var svg=q(".labsvg"), artsvg=q(".labart");
  var Tkey=null; ctrls.forEach(function(c){ if(c.isT) Tkey=c.k; });

  function labels(){
    host.querySelectorAll(".lv").forEach(function(el){
      var c=ctrls[+el.getAttribute("data-i")];
      el.textContent=S.p[c.k]+(c.unit||"");
    });
    host.querySelectorAll(".rv").forEach(function(el){
      el.textContent=readouts[+el.getAttribute("data-i")].f(S);
    });
  }
  /* Art changes only when a file finishes loading or fails, so it is painted
     on its own layer rather than rebuilt with every frame of the scene. */
  function paintArt(){
    if(!artsvg) return;
    var a=[];
    if(cfg.art)    a.push(ART.tag(cfg.art, viz.vb));
    if(cfg.artTop) a.push(ART.tag(cfg.artTop, viz.vb));
    artsvg.innerHTML=a.join("");
    artsvg.hidden=!a.join("");
  }
  /* One repaint per frame, never one per event.

     A drag fires "input" far faster than the screen refreshes, and each repaint
     rebuilds the whole scene with innerHTML. Doing that synchronously inside
     the handler puts rendering on the critical path of pointer delivery: on a
     slower machine the events queue behind their own repaints and the thumb
     stops following the cursor until the pointer is released. Coalescing into
     an animation frame keeps the handler O(1) - the last value before the frame
     is the one drawn, which is exactly what the reader should see - and stops
     the play loop and a drag from painting the same frame twice. */
  var frame=null;
  function paint(){ frame=null; var o=[]; viz.draw(S,o,cfg); svg.innerHTML=o.join(""); labels(); }
  function draw(){ if(frame===null) frame=requestAnimationFrame(paint); }
  function applyStep(){
    var st=S.script[S.step]; if(!st) return;
    q(".g-step").textContent=t("lab.step")+" "+(S.step+1)+" / "+S.script.length;
    q(".g-text").textContent=tx(st.say);
    for(var k in st.set) S.p[k]=st.set[k];
    S.t=0;
    host.querySelectorAll(".cv").forEach(function(el){ el.value=S.p[ctrls[+el.getAttribute("data-i")].k]; });
    draw();
  }
  /* Guided is an OFFER, never a gate: sandbox is default and the
     controls stay live in either mode. */
  function setMode(m){
    S.mode=m;
    q(".m-guided").classList.toggle("on",m==="guided");
    q(".m-sandbox").classList.toggle("on",m==="sandbox");
    var g=(m==="guided"&&S.script);
    q(".guide").hidden=!g; q(".g-nav").hidden=!g;
    if(g) applyStep(); else draw();
  }
  function tick(){
    if(!S.playing) return;
    var lim = Tkey ? S.p[Tkey] : 10;
    S.t+=0.035;
    if(S.t>=lim){ S.t=lim; S.playing=false; var b=q(".b-play"); if(b) b.textContent=t("lab.play"); }
    paint();   /* already inside a frame - scheduling another would cost one */
    if(S.playing) S.raf=requestAnimationFrame(tick);
  }
  host.querySelectorAll(".cv").forEach(function(el){
    el.addEventListener("input",function(){
      var c=ctrls[+el.getAttribute("data-i")];
      S.p[c.k]=parseFloat(el.value);
      if(Tkey && S.t>S.p[Tkey]) S.t=S.p[Tkey];
      draw();
    });
  });
  q(".m-guided").addEventListener("click",function(){ if(S.script) setMode("guided"); });
  q(".m-sandbox").addEventListener("click",function(){ setMode("sandbox"); });
  q(".g-next").addEventListener("click",function(){ if(S.step<S.script.length-1){ S.step++; applyStep(); } else setMode("sandbox"); });
  q(".g-prev").addEventListener("click",function(){ if(S.step>0){ S.step--; applyStep(); } });
  q(".g-skip").addEventListener("click",function(){ setMode("sandbox"); });
  if(animated){
    q(".b-play").addEventListener("click",function(){
      S.playing=!S.playing; this.textContent=S.playing?t("lab.pause"):t("lab.play");
      var lim=Tkey?S.p[Tkey]:10;
      if(S.playing){ if(S.t>=lim) S.t=0; S.raf=requestAnimationFrame(tick); }
    });
    q(".b-rew").addEventListener("click",function(){
      S.playing=false; S.t=0; q(".b-play").textContent=t("lab.play"); draw();
    });
  }
  if(!S.script) q(".m-guided").hidden=true;
  S.redraw=draw;
  /* A caption is text in the DOM, so it follows the language switch. */
  S.repaintArt=function(){ paintArt(); var c=q(".lab-cap"); if(c&&cfg.caption) c.textContent=tx(cfg.caption); };
  paintArt();
  setMode("sandbox");
  LABS.push(S);
  return S;
}

var OBS=null;
function buildSections(){
  LABS.forEach(function(l){ l.playing=false; if(l.raf) cancelAnimationFrame(l.raf); });
  LABS=[];
  var host=document.getElementById("nodeSections"); host.innerHTML="";
  CHAPTER.nodes.forEach(function(n,i){
    var hasLab = !!(n.viz);
    var sec=document.createElement("section");
    sec.className="node-sec"; sec.id="sec-"+n.id;
    sec.setAttribute("data-node",n.id); sec.setAttribute("data-nolab",hasLab?"0":"1");
    var main='<div class="node-body">';
    tx(n.body).forEach(function(p){ main+="<p>"+p+"</p>"; });
    main+='</div>';
    if(n.formula) main+='<div class="formula">'+tx(n.formula)+(n.flabel?'<small>'+tx(n.flabel)+'</small>':'')+'</div>';
    if(n.methods && n.methods.length){
      main+='<div class="methods-here"><span class="label">'+t("study.methods")+'</span><div>';
      n.methods.forEach(function(m){
        var def=null; CHAPTER.methods.forEach(function(x){ if(x.id===m) def=x; });
        main+='<span class="mtag">'+m+' · '+(def?tx(def.name):"")+'</span>';
      });
      main+='</div></div>';
    }
    sec.innerHTML='<div class="node-head"><span class="node-num">'+String(i+1).padStart(2,"0")+'</span><h3>'+tx(n.title)+'</h3></div>'+
                  '<div class="node-split"><div class="node-main">'+main+'</div></div>';
    if(hasLab){
      var lh=document.createElement("div");
      sec.querySelector(".node-split").appendChild(lh);
      makeLab(n,lh);
    }
    host.appendChild(sec);
  });
  observeSections();
}
function observeSections(){
  if(OBS) OBS.disconnect();
  if(!("IntersectionObserver" in window)){
    CHAPTER.nodes.forEach(function(n){ STATE.read[n.id]=true; }); save(); drawMap(); return;
  }
  OBS=new IntersectionObserver(function(en){
    var ch=false;
    en.forEach(function(e){
      if(e.isIntersecting && e.intersectionRatio>=0.3){
        var id=e.target.getAttribute("data-node");
        if(STATE.current!==id){ STATE.current=id; ch=true; }
        if(!STATE.read[id]){ STATE.read[id]=true; ch=true; }
      }
    });
    if(ch){ save(); drawMap(); }
  },{threshold:[0.3]});
  document.querySelectorAll(".node-sec").forEach(function(s){ OBS.observe(s); });
}

function buildQuestion(m,s){

  var opts=q.opts.map(function(o){
    var lbl=Array.isArray(o.v)?o.v[L()]:(o.v+(q.unit||""));
    return { label:lbl, ok:!!o.ok, trap:o.trap||null };
  });

}
function generate(){
  var ms=chosen("#bpMethods"), ss=chosen("#bpSurfaces");
  var list=document.getElementById("qlist"); list.innerHTML="";
  if(!ms.length||!ss.length){
    list.innerHTML='<div class="q"><div class="q-body"><p class="q-stem">'+t("forge.pickFirst")+'</p></div></div>'; return;
  }
  var n=parseInt(document.getElementById("bpCount").value,10)||12;
  var mode=document.getElementById("bpMode").value, pairs=[];
  if(mode==="coverage"){
    for(var i=0;i<ms.length;i++) for(var j=0;j<ss.length;j++) pairs.push([ms[i],ss[j]]);

    var base=pairs.slice();
    while(pairs.length<n) pairs=pairs.concat(base);
    pairs=pairs.slice(0,n);
  } else { for(var k=0;k<n;k++) pairs.push([pick(ms),pick(ss)]); }
  var made=0;
  pairs.forEach(function(p){ var q=buildQuestion(p[0],p[1]); if(q){ list.appendChild(qCard(q,made)); made++; } });
}

function setView(v){
  ["learn","forge"].forEach(function(x){ document.getElementById("view-"+x).classList.toggle("active",x===v); });
  document.querySelectorAll("nav.surfaces button").forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.view===v?"true":"false");
  });
}
function applyLang(){
  document.documentElement.setAttribute("lang",STATE.lang);
  document.querySelectorAll("[data-i18n]").forEach(function(el){ el.textContent=t(el.getAttribute("data-i18n")); });
  var fs=document.getElementById("footSrc");
  if(fs) fs.textContent=t("foot.src."+(CHAPTER.subject||"physics"));
  document.getElementById("chNum").textContent=tx(CHAPTER.kicker);
  document.getElementById("chTitle").textContent=tx(CHAPTER.title);
  document.getElementById("mapTitle").textContent=tx(CHAPTER.mapTitle);
  document.getElementById("mapLede").textContent=tx(CHAPTER.lede);
  document.getElementById("mapFig").textContent="Fig "+CHAPTER.num+".0 · "+t("map.fig");
  var ext=document.getElementById("mapExt");
  if(CHAPTER.next){ ext.textContent=tx(CHAPTER.next); ext.style.display=""; } else { ext.style.display="none"; }
  document.getElementById("langBtn").textContent = STATE.lang==="en"?"ไทย":"English";
  document.getElementById("themeBtn").textContent =
    (document.documentElement.getAttribute("data-theme")==="dark") ? t("ui.themeLight") : t("ui.theme");
  buildSections(); drawMap(); drawBlueprint(); drawCoverage();
}
document.querySelectorAll("nav.surfaces button").forEach(function(b){
  b.addEventListener("click",function(){ setView(b.dataset.view); });
});
document.getElementById("langBtn").addEventListener("click",function(){
  STATE.lang = STATE.lang==="en"?"th":"en"; save(); applyLang();
});
document.getElementById("themeBtn").addEventListener("click",function(){
  var next = document.documentElement.getAttribute("data-theme")==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);
  ART.repaint();          /* a light-ground plate is not shown on dark ground */
  STATE.theme=next; save();
  document.getElementById("themeBtn").textContent = next==="dark"?t("ui.themeLight"):t("ui.theme");
  LABS.forEach(function(l){ if(l.redraw) l.redraw(); if(l.repaintArt) l.repaintArt(); });
});
document.getElementById("resetBtn").addEventListener("click",function(){
  STATE={lang:STATE.lang,theme:STATE.theme,read:{},cov:{},current:CHAPTER.nodes[0].id};
  save(); applyLang(); setView("learn"); window.scrollTo({top:0,behavior:"smooth"});
});
document.getElementById("genBtn").addEventListener("click",generate);

if(STATE.theme) document.documentElement.setAttribute("data-theme",STATE.theme);
applyLang();
setView("learn");
generate();

</script>
</body>
</html>
