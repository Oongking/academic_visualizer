<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vectors</title>
<style>
/* ============================================================
   LEARNING PACKAGE ENGINE — shared stylesheet
   Visual identity: Editorial / Museum  (Project Concept §11)
   Tokens only. No colour is ever defined solely in a media query.
   ============================================================ */
:root{
  --ground:#FFFFFF; --surface:#FBFAF9;
  --ink:#0C0B0C; --ink-soft:#4A474A; --ink-faint:#9B979A;
  --rule:#E7E4E4; --accent:#E63946; --on-accent:#FFFFFF;
  --good:#1B7F5A; --warn:#B4690E;
  --f-display:"Bodoni Moda",Didot,"Bodoni MT",Georgia,serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --radius:0px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0C0C0D; --surface:#141415;
    --ink:#F2F0EE; --ink-soft:#B0ACA9; --ink-faint:#77736F;
    --rule:#262525; --accent:#FF5A66; --on-accent:#14090A;
    --good:#3FBF8F; --warn:#E0A040;
  }
}
:root[data-theme="dark"]{
  --ground:#0C0C0D; --surface:#141415;
  --ink:#F2F0EE; --ink-soft:#B0ACA9; --ink-faint:#77736F;
  --rule:#262525; --accent:#FF5A66; --on-accent:#14090A;
  --good:#3FBF8F; --warn:#E0A040;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-body);font-size:17px;line-height:1.68;-webkit-font-smoothing:antialiased}
.shell{max-width:1180px;margin:0 auto;padding:0 28px 96px}

/* ---------- page nav ----------
   Back, up and forward at the top of every page. Three columns so the middle
   sits centred whether or not the outer two exist; the ends collapse to empty
   spans on the first and last page rather than shifting the row. */
.pagenav{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;
  padding:14px 0 13px;border-bottom:1px solid var(--rule)}
.pn{font-family:var(--f-ui);font-size:11.5px;text-decoration:none;color:var(--ink-soft);
  display:flex;flex-direction:column;gap:2px;min-width:0;transition:color .14s}
.pn-k{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-faint)}
.pn-t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn.prev{text-align:left}
.pn.next{text-align:right;align-items:flex-end}
.pn.up{text-align:center;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  font-size:10.5px;color:var(--ink-faint)}
a.pn:hover,a.pn:hover .pn-k{color:var(--accent)}
a.pn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* the arrows belong to the control, not the label - drawn here so the
   link text stays clean for the language switch */
a.pn.prev .pn-t::before{content:"←\00a0"}
a.pn.next .pn-t::after{content:"\00a0→"}
a.pn.up .pn-t::before{content:"↑\00a0"}
@media (max-width:640px){
  .pagenav{grid-template-columns:1fr auto 1fr;gap:10px}
  .pn-t{font-size:11px}
}
@media (max-width:640px){ .shell{padding:0 18px 64px} }

.label{font-family:var(--f-ui);font-size:11px;font-weight:600;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.label.accent{color:var(--accent)}

header.mast{display:flex;flex-wrap:wrap;gap:18px;align-items:baseline;justify-content:space-between;
  border-bottom:1px solid var(--rule);padding:26px 0 18px;margin-bottom:30px}
.mast-id{display:flex;flex-direction:column;gap:3px}
.mast-id .ch{font-family:var(--f-ui);font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
/* on every page but the front one this label is the way back to it */
a.ch.home{text-decoration:none;border-bottom:1px solid transparent;
  transition:color .14s,border-color .14s}
a.ch.home:hover{color:var(--ink);border-bottom-color:var(--rule)}
a.ch.home:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.mast-id h1{margin:0;font-family:var(--f-display);font-weight:400;
  font-size:clamp(26px,4vw,40px);line-height:1.05;letter-spacing:-.015em}
.mast-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.06em;
  padding:7px 13px;border:1px solid var(--rule);background:transparent;
  color:var(--ink-soft);cursor:pointer;border-radius:var(--radius);
  transition:border-color .14s,color .14s}
.btn:hover{border-color:var(--ink-soft);color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}

nav.surfaces{display:flex;border-bottom:1px solid var(--rule);margin-bottom:38px}
nav.surfaces button{font-family:var(--f-ui);font-size:12px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;background:transparent;border:none;cursor:pointer;
  color:var(--ink-faint);padding:12px 20px 13px;border-bottom:2px solid transparent;
  margin-bottom:-1px;transition:color .14s,border-color .14s}
nav.surfaces button:hover{color:var(--ink)}
nav.surfaces button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.surfaces button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.view{display:none}
.view.active{display:block}

.eyebrow{font-family:var(--f-ui);font-size:11px;font-weight:600;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
h2.sec{margin:0 0 8px;font-family:var(--f-display);font-weight:400;
  font-size:clamp(24px,3.2vw,32px);line-height:1.12;letter-spacing:-.015em}
.lede{margin:0 0 30px;color:var(--ink-soft);max-width:64ch;font-size:17px}

.plate{border:1px solid var(--rule);background:var(--surface);padding:22px;margin:0}
.plate figcaption{font-family:var(--f-ui);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);margin-top:14px;text-align:center}

/* ---------- MAP ---------- */
.map-wrap{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:860px){ .map-wrap{grid-template-columns:1fr} }
#mapsvg{width:100%;height:auto;display:block}
.mnode{cursor:pointer}
.mnode rect{fill:var(--ground);stroke:var(--rule);stroke-width:1.5;transition:all .18s}
.mnode text{font-family:var(--f-ui);font-size:11.5px;font-weight:600;
  fill:var(--ink-faint);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.mnode[data-state="upcoming"]{opacity:.5}
.mnode[data-state="available"] rect{stroke:var(--ink-soft)}
.mnode[data-state="available"] text{fill:var(--ink)}
.mnode[data-state="read"] rect{fill:var(--ink);stroke:var(--ink)}
.mnode[data-state="read"] text{fill:var(--ground)}
.mnode[data-state="trained"] rect{fill:var(--ink);stroke:var(--accent);stroke-width:2.5}
.mnode[data-state="trained"] text{fill:var(--ground)}
.mnode[data-current="1"] rect{stroke:var(--accent);stroke-width:3}
.mnode:hover rect{stroke:var(--accent)}
.mnode:focus-visible rect{stroke:var(--accent);stroke-width:3}
.medge{stroke:var(--rule);stroke-width:1.5;fill:none}
.medge.lit{stroke:var(--ink-soft)}
.medge.ext{stroke-dasharray:4 4;stroke:var(--ink-faint);opacity:.6}
.mext text{font-family:var(--f-ui);font-size:10.5px;fill:var(--ink-faint);text-anchor:middle}

.legend{display:flex;flex-direction:column;gap:15px}
.legend-row{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--ink-soft)}
.swatch{width:34px;height:20px;flex:0 0 auto;border:1.5px solid var(--rule);background:var(--ground);margin-top:2px}
.swatch.up{opacity:.5}
.swatch.avail{border-color:var(--ink-soft)}
.swatch.read{background:var(--ink);border-color:var(--ink)}
.swatch.trained{background:var(--ink);border-color:var(--accent);border-width:2.5px}
.legend-row b{display:block;color:var(--ink);font-family:var(--f-ui);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-bottom:2px}
.prog{border:1px solid var(--rule);padding:16px 18px;background:var(--surface)}
.prog .big{font-family:var(--f-display);font-size:34px;line-height:1;margin:6px 0 2px}

/* ---------- NODE SECTIONS ---------- */
.chapter-rule{border:none;border-top:1px solid var(--rule);margin:56px 0 0}
.node-sec{padding:52px 0;border-bottom:1px solid var(--rule);scroll-margin-top:20px}

/* ---------- reference table ----------
   A table of cases, read whole. Hairline rules and space, no fills: the
   house style draws structure with the grid itself. */
.xtable{margin:26px 0 0}
.xtable figcaption{margin-bottom:12px}
.xscroll{overflow-x:auto}
.xtable table{border-collapse:collapse;width:100%;font-size:14px}
.xtable th{font-family:var(--f-ui);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);text-align:left;
  padding:0 16px 8px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.xtable td{padding:10px 16px 10px 0;border-bottom:1px solid var(--rule);
  color:var(--ink-soft);vertical-align:top;line-height:1.5}
.xtable tr td:first-child{color:var(--ink);font-weight:600}
.xtable tr:last-child td{border-bottom:none}
.xnote{margin:12px 0 0;font-family:var(--f-ui);font-size:11.5px;color:var(--ink-faint);
  line-height:1.6}
.xfacts{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;
  font-size:14px}
.xfacts dt{font-family:var(--f-ui);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);padding-top:3px}
.xfacts dd{margin:0;color:var(--ink-soft)}
.node-sec:last-child{border-bottom:none}
.node-head{display:flex;gap:18px;align-items:baseline;margin-bottom:20px}
.node-num{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.14em;
  color:var(--ink-faint);flex:0 0 auto;padding-top:6px}
.node-sec h3{margin:0;font-family:var(--f-display);font-weight:400;
  font-size:clamp(28px,4vw,40px);line-height:1.08;letter-spacing:-.015em}
.node-split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:40px;align-items:start}
.node-sec[data-nolab="1"] .node-split{grid-template-columns:minmax(0,66ch)}
/* A table wants the whole column; its prose still wants a readable measure. */
.node-sec[data-table="1"] .node-split{grid-template-columns:minmax(0,1fr)}
.node-sec[data-table="1"] .node-body p,
.node-sec[data-table="1"] .xnote{max-width:66ch}
@media (max-width:1000px){ .node-split{grid-template-columns:1fr;gap:28px} }
.node-body p{margin:0 0 18px;color:var(--ink-soft)}
.node-body .keyterm{color:var(--ink);font-weight:600}

.formula{border-top:2px solid var(--ink);border-bottom:1px solid var(--rule);
  padding:18px 0;margin:26px 0;text-align:center;
  font-family:var(--f-display);font-size:clamp(19px,2.4vw,25px);color:var(--ink)}
.formula small{display:block;font-family:var(--f-ui);font-size:11px;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);margin-top:10px}

.methods-here{border:1px solid var(--rule);padding:14px 16px;margin-top:24px;background:var(--surface)}
.methods-here .label{margin-bottom:8px;display:block}
.mtag{display:inline-block;font-family:var(--f-ui);font-size:10.5px;font-weight:600;
  letter-spacing:.08em;padding:3px 8px;border:1px solid var(--rule);color:var(--ink-soft);margin:2px 4px 2px 0}

/* ---------- LAB ---------- */
.lab{border:1px solid var(--rule);background:var(--surface);margin:0;position:sticky;top:16px}
@media (max-width:1000px){ .lab{position:static} }
.lab-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:1px solid var(--rule)}
.lab-mode{display:flex;gap:6px}
.lab svg{display:block;width:100%;height:auto}
/* Art plate. The picture is its own layer under the scene so an animating
   visualizer never re-decodes it, and the caption sits beneath the frame in
   the utility face, the way every plate in this house style is captioned. */
.lab-stage{position:relative}
.lab-stage .labart{position:absolute;left:0;top:0;width:100%;height:100%;
  pointer-events:none}
.lab-stage .labart[hidden]{display:none}
/* A neutral texture may be flipped for the dark theme; authored artwork never
   is - it either ships a dark variant or steps aside. */
.lab-stage .labart .art-invert{filter:invert(1) brightness(.92)}
.lab-cap{margin:0;padding:12px 16px 0;font-family:var(--f-ui);font-size:11px;
  font-weight:500;letter-spacing:.04em;color:var(--ink-faint);line-height:1.5}
.lab-body{padding:16px}
.guide{border-left:2px solid var(--accent);padding:10px 14px;margin-bottom:14px;
  background:var(--ground);min-height:62px;display:flex;flex-direction:column;justify-content:center}
.guide p{margin:0;font-size:15px;color:var(--ink-soft)}
.guide .step{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:4px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:14px}
.ctrl label{display:flex;justify-content:space-between;gap:10px;font-family:var(--f-ui);
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:5px}
.ctrl label span:last-child{color:var(--ink);font-variant-numeric:tabular-nums}
/* touch-action:none is what keeps a drag on the control from being handed to
   the page as a scroll gesture - on a trackpad, pen or touchscreen the browser
   otherwise takes the gesture partway through and the thumb stops following
   until you press again. The extra height is hit area, not decoration: the
   default track is about 16px tall and easy to catch the edge of. */
.ctrl input[type=range]{width:100%;height:24px;margin:0;accent-color:var(--accent);
  cursor:pointer;touch-action:none}

/* A choice reads as its options, not as a number on a track. Hairline boxes
   sharing an edge, the picked one filled - the same language as the mode
   switch above the plate. */
.ctrl.choice .opts{display:flex;flex-wrap:wrap;gap:0;margin-top:2px}
.opt-b{font-family:var(--f-ui);font-size:11.5px;font-weight:500;
  padding:7px 12px;border:1px solid var(--rule);background:transparent;
  color:var(--ink-soft);cursor:pointer;border-radius:var(--radius);
  margin:0 -1px -1px 0;transition:color .14s,border-color .14s,background .14s}
.opt-b:hover{color:var(--ink);border-color:var(--ink-faint);position:relative;z-index:1}
.opt-b.on{background:var(--ink);border-color:var(--ink);color:var(--ground);
  font-weight:600;position:relative;z-index:2}
.opt-b:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;
  position:relative;z-index:3}
.readouts{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--rule)}
.ro b{display:block;font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);font-weight:600;margin-bottom:3px}
.ro span{font-family:var(--f-display);font-size:21px;color:var(--ink);font-variant-numeric:tabular-nums}
.transport{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ---------- FORGE ---------- */
.forge-grid{display:grid;grid-template-columns:minmax(0,290px) minmax(0,1fr);gap:36px;align-items:start}
@media (max-width:940px){ .forge-grid{grid-template-columns:1fr} }
.bp{border:1px solid var(--rule);background:var(--surface);padding:18px;position:sticky;top:16px}
@media (max-width:940px){ .bp{position:static} }
.bp h4{margin:0 0 4px;font-family:var(--f-ui);font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.bp-group{margin-bottom:18px}
.check{display:flex;gap:9px;align-items:flex-start;padding:4px 0;cursor:pointer;font-size:13.5px;color:var(--ink-soft)}
.check input{margin:5px 0 0;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
.check code{font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--ink-faint);letter-spacing:.05em}
.bp select,.bp input[type=number]{width:100%;font-family:var(--f-ui);font-size:13px;padding:7px 9px;
  border:1px solid var(--rule);background:var(--ground);color:var(--ink);border-radius:var(--radius)}
.gen{width:100%;margin-top:6px;background:var(--accent);color:var(--on-accent);
  border-color:var(--accent);font-size:13px;padding:11px}
.gen:hover{opacity:.88;border-color:var(--accent);color:var(--on-accent)}

.qlist{display:flex;flex-direction:column;gap:18px}
.q{border:1px solid var(--rule);background:var(--surface)}
.q-top{display:flex;gap:7px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule)}
.tg{font-family:var(--f-ui);font-size:9.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 7px;border:1px solid var(--rule);color:var(--ink-faint)}
.tg.m{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.q-body{padding:16px}
.q-stem{margin:0 0 14px;font-size:16px;color:var(--ink)}
.q-fig{margin:0 0 14px;border:1px solid var(--rule);background:var(--ground);padding:10px}
.q-fig svg{display:block;width:100%;max-width:320px;margin:0 auto;height:auto}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:11px;align-items:baseline;text-align:left;width:100%;
  font-family:var(--f-body);font-size:15px;padding:10px 13px;cursor:pointer;
  border:1px solid var(--rule);background:var(--ground);color:var(--ink-soft);
  border-radius:var(--radius);transition:border-color .14s}
.opt:hover:not(:disabled){border-color:var(--ink-soft)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opt b{font-family:var(--f-ui);font-size:11px;font-weight:600;color:var(--ink-faint);flex:0 0 auto}
.opt:disabled{cursor:default}
.opt[data-mark="right"]{border-color:var(--good);color:var(--ink)}
.opt[data-mark="right"] b{color:var(--good)}
.opt[data-mark="wrong"]{border-color:var(--warn);color:var(--ink)}
.opt[data-mark="wrong"] b{color:var(--warn)}
.fb{margin-top:13px;padding:11px 13px;border-left:2px solid var(--good);
  background:var(--ground);font-size:14px;color:var(--ink-soft)}
.fb.trap{border-left-color:var(--warn)}
.fb b{color:var(--ink);font-family:var(--f-ui);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;display:block;margin-bottom:4px;font-weight:600}

.cov{margin-top:34px;overflow-x:auto}
.cov table{border-collapse:collapse;width:100%;min-width:520px}
.cov th,.cov td{border:1px solid var(--rule);padding:9px 10px;text-align:center;
  font-family:var(--f-ui);font-size:11.5px;font-variant-numeric:tabular-nums}
.cov th{color:var(--ink-faint);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
.cov th.rowh{text-align:left;color:var(--ink);max-width:210px;white-space:normal;line-height:1.35}
.cov td{color:var(--ink-faint)}
.cov td[data-hit="1"]{background:var(--ink);color:var(--ground);font-weight:600}
.cov td[data-hit="miss"]{color:var(--warn)}

footer.foot{border-top:1px solid var(--rule);margin-top:64px;padding-top:22px;
  font-family:var(--f-ui);font-size:11.5px;color:var(--ink-faint);
  display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;letter-spacing:.04em}
.foot a{color:var(--ink-soft);text-decoration:none;border-bottom:1px solid var(--rule)}
.foot a:hover{color:var(--accent);border-bottom-color:var(--accent)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* Course-family presentation, shared by the hub, maps and chapter readers.
   Reading palettes match the live linear algebra / differential equation UI. */
:root {
  color-scheme:light;
  --ground:#f4f6f8; --surface:#ffffff;
  --ink:#202b38; --ink-soft:#425268; --ink-faint:#53647a;
  --rule:#8996a7; --accent:#1a6183; --on-accent:#ffffff;
  --accent2:#96314d; --good:#216c3e; --warn:#805d12;
  --tint:#e8f3fa; --pink-tint:#faeef2; --card-hover:#f6faff;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"Noto Sans Thai",sans-serif;
  --f-body:var(--f-ui); --f-display:var(--f-ui); --radius:8px;
}
:root[data-reading-theme="warm"] {
  --ground:#f5efdf; --surface:#fffbef; --ink:#332d23;
  --ink-soft:#594e3b; --ink-faint:#695b45; --rule:#9b8b70;
  --tint:#ecefe5; --pink-tint:#f5e6de; --card-hover:#fffdf5;
}
:root[data-reading-theme="blue"] {

(function () {
  "use strict";
  var key = "edu-reading-theme", names = ["paper", "warm", "blue", "dark"];
  var selected = "paper";
  try {
    var saved = localStorage.getItem(key) || localStorage.getItem("linear-algebra-reading-theme");
    if (names.indexOf(saved) !== -1) selected = saved;
  } catch (e) {}
  function apply(value) {
    selected = names.indexOf(value) !== -1 ? value : "paper";
    document.documentElement.setAttribute("data-reading-theme", selected);
    document.documentElement.setAttribute("data-theme", selected === "dark" ? "dark" : "light");
    var select = document.getElementById("readingTheme");
    if (select) select.value = selected;
    document.dispatchEvent(new Event("readingthemechange"));
  }
  apply(selected);
  document.addEventListener("DOMContentLoaded", function () {
    var select = document.getElementById("readingTheme");
    select.value = selected;
    select.addEventListener("change", function () {
      apply(select.value);
      try { localStorage.setItem(key, selected); } catch (e) {}
    });
  });
  window.addEventListener("storage", function (event) {
    if (event.key === key) apply(event.newValue);
  });
})();
</script>

var CHAPTER = {
id:"ma09", num:"09", slug:"vectors", subject:"math",
kicker:["Mathematics · Chapter 09","คณิตศาสตร์ · บทที่ 9"],
title:["Vectors","เวกเตอร์"],
mapTitle:["Arrows that obey algebra","ลูกศรที่เชื่อฟังพีชคณิต"],
lede:["A vector is the smallest object that knows where it is going. Once direction becomes part of the number, addition stops behaving like ordinary addition, two entirely different products appear, and questions about angles, areas and volumes turn into arithmetic you can do without ever drawing the picture.",
      "เวกเตอร์คือสิ่งที่เล็กที่สุดซึ่งรู้ว่าตัวเองกำลังมุ่งไปทางไหน เมื่อทิศทางกลายเป็นส่วนหนึ่งของตัวเลข การบวกก็ไม่ทำงานแบบเลขธรรมดาอีกต่อไป เกิดผลคูณสองชนิดที่ต่างกันโดยสิ้นเชิง และคำถามเรื่องมุม พื้นที่ และปริมาตร ก็กลายเป็นการคำนวณที่ทำได้โดยไม่ต้องวาดรูปเลย"],

nodes:[
{ id:"basics", x:235, y:52, requires:[], methods:["M-01"],
  title:["Magnitude, direction, and adding arrows","ขนาด ทิศทาง และการบวกลูกศร"],
  body:[["A vector carries two facts at once — a magnitude and a direction — where a scalar carries only the first. Two vectors are equal when both facts agree, so an arrow may be slid anywhere on the page and remain the same vector as long as it is not turned or resized. The zero vector 0 is the one exception: its magnitude is zero and no direction needs to be named for it. Addition is head to tail — slide v until its tail sits on the head of u, and u + v is the arrow from the tail of u to the head of v. Multiplying by a scalar k stretches the arrow by a factor |k| and reverses it when k is negative, which is all that −u means.",
         "Because direction is part of the arithmetic, magnitudes almost never add. |u + v| = |u| + |v| holds only when u and v point exactly the same way; put any angle at all between them and the sum comes out shorter than the two parts. Reading |u + v| as |u| + |v| is trap T-01, and it costs more marks in this chapter than every algebraic slip combined."],
        ["เวกเตอร์บอกข้อมูลสองอย่างพร้อมกัน คือ ขนาด และ ทิศทาง ต่างจากสเกลาร์ที่มีแต่ขนาด เวกเตอร์สองตัวเท่ากันเมื่อข้อมูลทั้งสองตรงกัน ดังนั้นเลื่อนลูกศรไปที่ใดบนหน้ากระดาษก็ยังเป็นเวกเตอร์เดิม ตราบใดที่ไม่หมุนและไม่ยืดหด เวกเตอร์ศูนย์ 0 เป็นข้อยกเว้นเดียว คือมีขนาดเป็นศูนย์และไม่จำเป็นต้องกล่าวถึงทิศทาง การบวกใช้วิธีหัวต่อหาง เลื่อน v จนหางของ v ไปอยู่ที่หัวของ u แล้ว u + v คือลูกศรจากหางของ u ไปหัวของ v การคูณด้วยสเกลาร์ k ยืดลูกศรเป็น |k| เท่า และกลับทิศเมื่อ k เป็นลบ ซึ่งก็คือความหมายทั้งหมดของ −u",

  formula:["u + (−u) = 0        |u + v| ≤ |u| + |v|","u + (−u) = 0        |u + v| ≤ |u| + |v|"],
  flabel:["Equality needs size and direction","การเท่ากันต้องตรงทั้งขนาดและทิศ"],
  viz:"vector" },

{ id:"components", x:100, y:150, requires:["basics"], methods:["M-02"],
  title:["Components, unit vectors, direction cosines","ส่วนประกอบ เวกเตอร์หนึ่งหน่วย โคไซน์แสดงทิศทาง"],
  body:[["Fix a set of axes and every vector becomes a short list of numbers. Write a = a₁i + a₂j + a₃k, where i, j and k are the unit vectors along the positive axes. A vector between two points is terminal minus initial, coordinate by coordinate, so AB from A(1, 2, 2) to B(3, 5, 8) is 2i + 3j + 6k. Magnitude follows from Pythagoras extended into space: |a| = √(a₁² + a₂² + a₃²). Dividing a vector by its own length gives â = a / |a|, the unit vector pointing the same way, which is how you separate a direction from a size and rescale it to whatever length you need.",
         "The three ratios a₁/|a|, a₂/|a|, a₃/|a| are the direction cosines cos α, cos β and cos γ — the cosines of the angles the vector makes with each axis — and they always satisfy cos²α + cos²β + cos²γ = 1. Notice that it is the squares that add to one, not the cosines. Adding the raw cosines, or adding the components themselves to get a length, is trap T-01 wearing a three-dimensional disguise."],
        ["กำหนดแกนพิกัดแล้วเวกเตอร์ทุกตัวจะกลายเป็นชุดตัวเลขสั้นๆ เขียน a = a₁i + a₂j + a₃k โดย i, j และ k คือเวกเตอร์หนึ่งหน่วยตามแกนบวก เวกเตอร์ระหว่างจุดสองจุดคือจุดสิ้นสุดลบจุดเริ่มต้นทีละพิกัด ดังนั้น AB จาก A(1, 2, 2) ไป B(3, 5, 8) คือ 2i + 3j + 6k ขนาดหาได้จากพีทาโกรัสที่ขยายเข้าสู่สามมิติ |a| = √(a₁² + a₂² + a₃²) การหารเวกเตอร์ด้วยความยาวของตัวเองให้ â = a / |a| ซึ่งเป็นเวกเตอร์หนึ่งหน่วยทิศเดียวกัน นี่คือวิธีแยกทิศทางออกจากขนาด แล้วปรับขนาดใหม่เป็นเท่าใดก็ได้ตามต้องการ",
         "อัตราส่วนสามค่า a₁/|a|, a₂/|a|, a₃/|a| คือโคไซน์แสดงทิศทาง cos α, cos β และ cos γ ซึ่งเป็นโคไซน์ของมุมที่เวกเตอร์ทำกับแต่ละแกน และเป็นจริงเสมอว่า cos²α + cos²β + cos²γ = 1 สังเกตว่าสิ่งที่บวกกันได้ 1 คือกำลังสอง ไม่ใช่ตัวโคไซน์เอง การบวกโคไซน์ดิบๆ หรือการบวกส่วนประกอบเพื่อหาความยาว คือกับดัก T-01 ที่มาในคราบสามมิติ"]],
  formula:["|a| = √(a₁² + a₂² + a₃²)        â = a / |a|","|a| = √(a₁² + a₂² + a₃²)        â = a / |a|"],
  flabel:["Squares add to one, not cosines","กำลังสองรวมได้ 1 ไม่ใช่ตัวโคไซน์"],
  viz:"bars",
  vizcfg:{
    title:["A VECTOR SPLIT INTO ITS COMPONENTS","เวกเตอร์ที่แตกเป็นองค์ประกอบ"],
    ylab:["units","หน่วย"],
    ctrls:[
      {k:"m",  lab:["Magnitude","ขนาด"], min:1, max:20, step:.5, def:10, unit:""},

    ],

      {lab:["y-component","องค์ประกอบ y"], f:function(S){

      {lab:["Check by Pythagoras","ตรวจด้วยพีทาโกรัส"], f:function(S){
        var p=S.p, x=p.m*Math.cos(p.th*Math.PI/180), y=p.m*Math.sin(p.th*Math.PI/180);
        return fmt2(Math.sqrt(x*x+y*y))+(L()?" · กลับมาเท่าขนาดเดิม":" · back to the magnitude"); }},
      {lab:["Do components add as numbers?","องค์ประกอบบวกกันแบบตัวเลขได้ไหม"], f:function(){
        return L()?"ได้ — นั่นคือเหตุผลที่เราแตกองค์ประกอบ":"yes — that is the entire reason for resolving"; }}

    bars:[

  },

    {say:["Straight up. The x-component collapses to zero and all the magnitude is vertical.",
          "ชี้ขึ้นตรงๆ องค์ประกอบ x ยุบเป็นศูนย์ และขนาดทั้งหมดอยู่ในแนวดิ่ง"], set:{m:10,th:90}},
    {say:["Point it into the third quadrant and both components go negative together.",
          "ชี้ไปยังควอดรันต์ที่สาม องค์ประกอบทั้งสองเป็นลบพร้อมกัน"], set:{m:10,th:215}}
  ] },

{ id:"dot", x:370, y:150, requires:["basics"], methods:["M-03"],
  title:["The dot product","ผลคูณเชิงสเกลาร์"],
  body:[["The dot product has two faces that always agree: a · b = |a||b| cos θ, and in components a · b = a₁b₁ + a₂b₂ + a₃b₃. Use the component form to compute and the cosine form to interpret. Its output is a single number — a scalar — and the sign of that number reports the angle for free: positive means θ is acute, zero means θ is exactly 90°, and negative means θ is obtuse. The perpendicularity test falls straight out of this, since cos 90° = 0 makes a · b = 0 the definition of a ⊥ b for non-zero vectors. Taking a with itself gives a · a = |a|², which is how magnitude re-enters an argument written entirely in dot products.",
         "Two traps share this node. The first is species confusion: a dot product is a scalar and must never be written carrying an i, j or k, just as a cross product is never a bare number — that is trap T-02. The second is the function itself. The dot product takes cosine, not sine; substituting sin makes a · b vanish for parallel vectors and peak for perpendicular ones, which is exactly backwards, and that is trap T-04."],
        ["ผลคูณเชิงสเกลาร์มีสองหน้าที่สอดคล้องกันเสมอ คือ a · b = |a||b| cos θ และในรูปส่วนประกอบ a · b = a₁b₁ + a₂b₂ + a₃b₃ ใช้รูปส่วนประกอบเพื่อคำนวณ และใช้รูปโคไซน์เพื่อตีความ ผลลัพธ์เป็นจำนวนเดียว คือสเกลาร์ และเครื่องหมายของจำนวนนั้นบอกมุมให้ฟรีๆ ค่าบวกแปลว่า θ เป็นมุมแหลม ค่าศูนย์แปลว่า θ เท่ากับ 90° พอดี และค่าลบแปลว่า θ เป็นมุมป้าน การทดสอบการตั้งฉากจึงตามมาทันที เพราะ cos 90° = 0 ทำให้ a · b = 0 เป็นนิยามของ a ⊥ b สำหรับเวกเตอร์ที่ไม่เป็นศูนย์ และการคูณ a กับตัวเองให้ a · a = |a|² ซึ่งเป็นทางที่ขนาดกลับเข้ามาในการพิสูจน์ที่เขียนด้วยผลคูณเชิงสเกลาร์ล้วนๆ",
         "กับดักสองข้ออยู่ที่โหนดนี้ ข้อแรกคือความสับสนเรื่องชนิด ผลคูณเชิงสเกลาร์เป็นสเกลาร์และต้องไม่มี i, j หรือ k ติดมาด้วยเด็ดขาด เช่นเดียวกับที่ผลคูณเชิงเวกเตอร์ไม่มีทางเป็นตัวเลขเปล่าๆ นั่นคือกับดัก T-02 ข้อที่สองคือตัวฟังก์ชันเอง ผลคูณเชิงสเกลาร์ใช้โคไซน์ ไม่ใช่ไซน์ การใส่ sin แทนจะทำให้ a · b เป็นศูนย์เมื่อเวกเตอร์ขนานกัน และมีค่าสูงสุดเมื่อตั้งฉาก ซึ่งกลับด้านกันพอดี นั่นคือกับดัก T-04"]],
  formula:["a · b = |a||b| cos θ = a₁b₁ + a₂b₂ + a₃b₃","a · b = |a||b| cos θ = a₁b₁ + a₂b₂ + a₃b₃"],
  flabel:["A number, never an arrow","เป็นจำนวน ไม่ใช่ลูกศร"],
  viz:"vector",
  guide:[
    {say:["Start perpendicular. A runs along the axis and B stands at 90° to it, so cos θ = 0 and the dot product is exactly zero — 12 × 9 × 0. Read the resultant: R = 15, and 15² = 12² + 9². When the dot product vanishes, Pythagoras is restored.",
          "เริ่มที่การตั้งฉาก A วางตามแกนและ B ตั้งฉาก 90° กับมัน ดังนั้น cos θ = 0 และผลคูณเชิงสเกลาร์เป็นศูนย์พอดี คือ 12 × 9 × 0 ดูค่าผลลัพธ์ R = 15 และ 15² = 12² + 9² เมื่อผลคูณเชิงสเกลาร์เป็นศูนย์ พีทาโกรัสก็กลับมาใช้ได้"], set:{A:12,tA:0,B:12,tB:90}},
    {say:["Now swing B onto A. With θ = 0 the cosine is 1 and the dot product hits its maximum, 12 × 9 = 108. This is the only arrangement in which magnitudes really do add: R = 21 = 12 + 9. Every other angle gives a shorter resultant.",
          "ตอนนี้หมุน B ให้ทับ A เมื่อ θ = 0 โคไซน์เป็น 1 และผลคูณเชิงสเกลาร์ขึ้นถึงค่าสูงสุด 12 × 9 = 108 นี่เป็นการจัดวางแบบเดียวที่ขนาดบวกกันได้จริง R = 21 = 12 + 9 มุมอื่นทุกมุมให้ผลลัพธ์ที่สั้นกว่านี้"], set:{A:12,tA:0,B:9,tB:0}},
    {say:["Open the angle past 90° to 140°. The cosine has gone negative, so the dot product is negative too, about −83. The resultant collapses to under 8 — a shrinking resultant is the visible signature of an obtuse angle.",
          "เปิดมุมให้เกิน 90° ไปที่ 140° โคไซน์กลายเป็นลบ ผลคูณเชิงสเกลาร์จึงเป็นลบด้วย ราว −83 ผลลัพธ์หดลงเหลือไม่ถึง 8 การที่ผลลัพธ์หดสั้นคือร่องรอยที่มองเห็นได้ของมุมป้าน"], set:{A:12,tA:0,B:9,tB:140}},
    {say:["Push to 180° and the dot product bottoms out at −108. Since R² = |a|² + |b|² + 2(a · b), you can always read the dot product off the picture: a · b = (R² − 144 − 81) / 2, which here gives (9 − 225) / 2 = −108.",
          "ดันไปถึง 180° ผลคูณเชิงสเกลาร์ลงต่ำสุดที่ −108 เนื่องจาก R² = |a|² + |b|² + 2(a · b) เราจึงอ่านผลคูณเชิงสเกลาร์จากภาพได้เสมอ a · b = (R² − 144 − 81) / 2 ซึ่งในที่นี้ได้ (9 − 225) / 2 = −108"], set:{A:12,tA:0,B:9,tB:180}}
  ]},

{ id:"cross", x:235, y:248, requires:["components","dot"], methods:["M-04"],
  title:["The cross product","ผลคูณเชิงเวกเตอร์"],
  body:[["The cross product exists in three dimensions only, and it is easiest to remember as a determinant with i, j, k across the top row and the components of u and v on the two rows beneath. Expanding along that top row gives u × v = (u₂v₃ − u₃v₂)i − (u₁v₃ − u₃v₁)j + (u₁v₂ − u₂v₁)k, where the minus sign attached to the j term is part of the determinant expansion and not an optional decoration. Its magnitude is |u × v| = |u||v| sin θ, and its direction is perpendicular to both u and v — which is precisely why it is the standard tool for producing a normal to a plane.",
         "Order matters here in a way it never did for the dot product. Swapping the two rows of a determinant flips its sign, so u × v = −v × u; writing them as equal is trap T-03. Two consequences follow immediately: u × u = 0 for every vector, and u · (u × v) = 0 always, since the cross product is perpendicular to its own factors. And keep the species straight — this product returns a vector while the dot product returns a scalar, which is trap T-02."],
        ["ผลคูณเชิงเวกเตอร์มีเฉพาะในสามมิติ และจำง่ายที่สุดในรูปดีเทอร์มิแนนต์ที่มี i, j, k อยู่แถวบน และส่วนประกอบของ u กับ v อยู่สองแถวล่าง กระจายตามแถวบนจะได้ u × v = (u₂v₃ − u₃v₂)i − (u₁v₃ − u₃v₁)j + (u₁v₂ − u₂v₁)k โดยเครื่องหมายลบหน้าพจน์ j เป็นส่วนหนึ่งของการกระจายดีเทอร์มิแนนต์ ไม่ใช่ของประดับที่จะใส่หรือไม่ใส่ก็ได้ ขนาดของมันคือ |u × v| = |u||v| sin θ และทิศทางตั้งฉากกับทั้ง u และ v ซึ่งเป็นเหตุผลตรงๆ ที่มันเป็นเครื่องมือมาตรฐานสำหรับหาเวกเตอร์ตั้งฉากกับระนาบ",
         "ลำดับสำคัญในแบบที่ไม่เคยสำคัญกับผลคูณเชิงสเกลาร์ การสลับสองแถวของดีเทอร์มิแนนต์ทำให้เครื่องหมายกลับ ดังนั้น u × v = −v × u การเขียนว่าทั้งสองเท่ากันคือกับดัก T-03 ผลที่ตามมาทันทีมีสองข้อ คือ u × u = 0 สำหรับทุกเวกเตอร์ และ u · (u × v) = 0 เสมอ เพราะผลคูณเชิงเวกเตอร์ตั้งฉากกับตัวประกอบของมันเอง และอย่าสับสนเรื่องชนิด ผลคูณนี้ให้เวกเตอร์ ส่วนผลคูณเชิงสเกลาร์ให้สเกลาร์ นั่นคือกับดัก T-02"]],
  formula:["|u × v| = |u||v| sin θ        u × v = −v × u","|u × v| = |u||v| sin θ        u × v = −v × u"],
  flabel:["An arrow, and the order decides its sign","เป็นลูกศร และลำดับกำหนดเครื่องหมาย"],
  viz:"bars",
  vizcfg:{
    title:["DOT AND CROSS PULL IN OPPOSITE DIRECTIONS","ผลคูณจุดกับผลคูณไขว้ดึงกันคนละทาง"],
    ylab:["value","ค่า"],
    ctrls:[
      {k:"A",  lab:["|A|","|A|"], min:1, max:10, step:.5, def:4, unit:""},
      {k:"B",  lab:["|B|","|B|"], min:1, max:10, step:.5, def:5, unit:""},
      {k:"th", lab:["Angle between them","มุมระหว่างกัน"], min:0, max:180, step:5, def:60, unit:"°"}
    ],
    readouts:[
      {lab:["Dot product A·B","ผลคูณจุด A·B"], f:function(S){
        return fmt2(S.p.A*S.p.B*Math.cos(S.p.th*Math.PI/180)); }},
      {lab:["Cross magnitude |A×B|","ขนาดผลคูณไขว้ |A×B|"], f:function(S){
        return fmt2(S.p.A*S.p.B*Math.sin(S.p.th*Math.PI/180)); }},
      {lab:["At 0°","ที่ 0°"], f:function(){
        return L()?"จุดสูงสุด · ไขว้เป็นศูนย์":"dot is maximal, cross is zero"; }},
      {lab:["At 90°","ที่ 90°"], f:function(){
        return L()?"จุดเป็นศูนย์ · ไขว้สูงสุด":"dot is zero, cross is maximal"; }}
    ],
    bars:[
      {lab:["Dot A·B","จุด A·B"], f:function(p){ return p.A*p.B*Math.cos(p.th*Math.PI/180); }, col:"accent"},
      {lab:["Cross |A×B|","ไขว้ |A×B|"], f:function(p){ return p.A*p.B*Math.sin(p.th*Math.PI/180); }, col:"good"},
      {lab:["|A||B|","|A||B|"], f:function(p){ return p.A*p.B; }, col:"faint"}
    ],
    note:["one uses cosine and the other sine, so whenever one peaks the other vanishes","ตัวหนึ่งใช้โคไซน์ อีกตัวใช้ไซน์ เมื่อตัวหนึ่งสูงสุด อีกตัวจึงหายไป"]
  },
  guide:[
    {say:["Parallel vectors. The dot product is at its maximum and the cross product is exactly zero.",
          "เวกเตอร์ขนานกัน ผลคูณจุดสูงสุดและผลคูณไขว้เป็นศูนย์พอดี"], set:{A:4,B:5,th:0}},
    {say:["Perpendicular now. The bars have swapped roles completely.",
          "ตอนนี้ตั้งฉากกัน แถบทั้งสองสลับบทบาทกันหมด"], set:{A:4,B:5,th:90}},
    {say:["Antiparallel. The dot product goes negative while the cross product returns to zero.",
          "ขนานกันแต่สวนทาง ผลคูณจุดเป็นลบ ขณะที่ผลคูณไขว้กลับมาเป็นศูนย์"], set:{A:4,B:5,th:180}}
  ] },

{ id:"applications", x:235, y:346, requires:["cross"], methods:["M-05","M-06"],
  title:["Areas, volumes, projections","พื้นที่ ปริมาตร โปรเจกชัน"],
  body:[["The whole chapter pays off here. A parallelogram with adjacent sides u and v has base |u| and height |v| sin θ, so its area is exactly |u × v| — and a triangle on the same two sides is half of that. Stack a third vector r on top and the parallelepiped they span has volume |u · (v × r)|, the scalar triple product, which is the absolute value of the determinant of the 3 × 3 matrix built from the three vectors. In two dimensions the same determinant collapses to the neat |u₁v₂ − u₂v₁| for a parallelogram, so plane-geometry area questions never need a base or a height to be found first. Projection runs the other way: Proj_v u = ((u · v) / |v|²) v resolves u into the part that lies along v.",
         "The two products divide the work cleanly, and swapping them is where marks go. Anything about area or volume is built on sines and the cross product; anything about angle, perpendicularity or projection is built on cosines and the dot product. Reaching for cosine when an area is asked for is trap T-04. And the triple product must finish as a scalar with an absolute value taken, because interchanging any two of the three vectors flips its sign while the box itself has not moved — that sign flip is trap T-03."],
        ["ทั้งบทมาออกดอกออกผลที่ตรงนี้ รูปสี่เหลี่ยมด้านขนานที่มีด้านประชิดเป็น u และ v มีฐาน |u| และสูง |v| sin θ พื้นที่จึงเท่ากับ |u × v| พอดี และรูปสามเหลี่ยมบนสองด้านเดียวกันมีพื้นที่ครึ่งหนึ่งของนั้น เพิ่มเวกเตอร์ที่สาม r เข้าไป ทรงสี่เหลี่ยมด้านขนานที่เกิดขึ้นมีปริมาตร |u · (v × r)| ซึ่งคือผลคูณสเกลาร์สามตัว และเท่ากับค่าสัมบูรณ์ของดีเทอร์มิแนนต์ของเมทริกซ์ 3 × 3 ที่สร้างจากเวกเตอร์ทั้งสาม ในสองมิติดีเทอร์มิแนนต์เดียวกันยุบเหลือ |u₁v₂ − u₂v₁| สำหรับสี่เหลี่ยมด้านขนาน โจทย์พื้นที่ในระนาบจึงไม่ต้องหาฐานหรือความสูงก่อนเลย ส่วนโปรเจกชันวิ่งไปอีกทาง Proj_v u = ((u · v) / |v|²) v แยกส่วนของ u ที่อยู่ตามแนว v ออกมา",
         "ผลคูณสองชนิดแบ่งงานกันชัดเจน และการสลับกันคือจุดที่คะแนนหาย เรื่องพื้นที่และปริมาตรสร้างบนไซน์และผลคูณเชิงเวกเตอร์ ส่วนเรื่องมุม การตั้งฉาก และโปรเจกชัน สร้างบนโคไซน์และผลคูณเชิงสเกลาร์ การคว้าโคไซน์มาใช้ตอนโจทย์ถามพื้นที่คือกับดัก T-04 และผลคูณสเกลาร์สามตัวต้องจบเป็นสเกลาร์ที่ใส่ค่าสัมบูรณ์แล้ว เพราะการสลับเวกเตอร์สองในสามตัวทำให้เครื่องหมายกลับทั้งที่กล่องยังไม่ขยับไปไหน การกลับเครื่องหมายนั้นคือกับดัก T-03"]],
  formula:["Area = |u × v|        Volume = |u · (v × r)|","พื้นที่ = |u × v|        ปริมาตร = |u · (v × r)|"],
  flabel:["Sine for size, cosine for alignment","ไซน์ไว้หาขนาด โคไซน์ไว้ดูแนว"],

var STR = {};

function L(){ return STATE.lang==="th"?1:0; }

function esc(v){ return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;")

/* ---------- 2 · helpers ---------- */
function ri(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function fmt(n){ return (Math.round(n*10)/10).toString(); }
function fmt2(n){ return (Math.round(n*100)/100).toString(); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function niceStep(range,target){
  if(!(range>0)) return 1;
  var raw=range/target, mag=Math.pow(10,Math.floor(Math.log(raw)/Math.LN10)), n=raw/mag;
  return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
}
function tk(n){ var r=Math.round(n*100)/100; return (Math.abs(r)<1e-9?0:r).toString(); }
var FT='fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="10"';

/* Shared, fully scaled axis frame. Returns mapping functions. */
function axes(o,c){
  var X=function(v){ return c.x + (v-c.xmin)/(c.xmax-c.xmin)*c.w; };
  var Y=function(v){ return c.y + c.h - (v-c.ymin)/(c.ymax-c.ymin)*c.h; };
  /* title / xlab / ylab accept either a plain string or an ["EN","TH"] pair */
  if(c.title) o.push('<text x="'+c.x+'" y="'+(c.y-22)+'" fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="10.5" letter-spacing="1.4">'+tx(c.title)+'</text>');
  var ys=niceStep(c.ymax-c.ymin,c.yticks||5), y0v=Math.ceil(c.ymin/ys)*ys;
  for(var i=0;c.yticks!==0 && i<=Math.floor((c.ymax-y0v)/ys+1e-9);i++){
    var vv=y0v+i*ys, gy=Y(vv);
    o.push('<line x1="'+c.x+'" y1="'+gy+'" x2="'+(c.x+c.w)+'" y2="'+gy+'" stroke="var(--rule)" stroke-width="1"/>');
    o.push('<line x1="'+(c.x-5)+'" y1="'+gy+'" x2="'+c.x+'" y2="'+gy+'" stroke="var(--ink-faint)" stroke-width="1"/>');
    o.push('<text x="'+(c.x-9)+'" y="'+(gy+3.5)+'" '+FT+' text-anchor="end">'+tk(vv)+'</text>');
  }
  var xs=niceStep(c.xmax-c.xmin,c.xticks||5), x0v=Math.ceil(c.xmin/xs)*xs;
  for(var j=0;c.xticks!==0 && j<=Math.floor((c.xmax-x0v)/xs+1e-9);j++){
    var uu=x0v+j*xs, gx=X(uu);
    o.push('<line x1="'+gx+'" y1="'+c.y+'" x2="'+gx+'" y2="'+(c.y+c.h)+'" stroke="var(--rule)" stroke-width="1"/>');
    o.push('<line x1="'+gx+'" y1="'+(c.y+c.h)+'" x2="'+gx+'" y2="'+(c.y+c.h+5)+'" stroke="var(--ink-faint)" stroke-width="1"/>');
    o.push('<text x="'+gx+'" y="'+(c.y+c.h+19)+'" '+FT+' text-anchor="middle">'+tk(uu)+'</text>');
  }
  var zy = (c.ymin<0&&c.ymax>0) ? Y(0) : c.y+c.h;
  o.push('<line x1="'+c.x+'" y1="'+c.y+'" x2="'+c.x+'" y2="'+(c.y+c.h)+'" stroke="var(--ink-faint)" stroke-width="1.6"/>');
  o.push('<line x1="'+c.x+'" y1="'+zy+'" x2="'+(c.x+c.w)+'" y2="'+zy+'" stroke="var(--ink-faint)" stroke-width="1.6"/>');
  if(c.ylab) o.push('<text transform="rotate(-90 15 '+(c.y+c.h/2)+')" x="15" y="'+(c.y+c.h/2)+'" '+FT+' text-anchor="middle">'+tx(c.ylab)+'</text>');
  if(c.xlab) o.push('<text x="'+(c.x+c.w)+'" y="'+(c.y+c.h+36)+'" '+FT+' text-anchor="end">'+tx(c.xlab)+'</text>');
  return { X:X, Y:Y, zy:zy };
}

/* Caption inside a visualizer. ALWAYS takes an ["EN","TH"] pair, so no drawing
   can quietly ship English-only text. o=out array, kind picks the styling. */
function cap(o,x,y,pair,kind){
  var st = kind==="eyebrow"
      ? 'fill="var(--ink-faint)" font-size="10" letter-spacing="1.4"'
    : kind==="note"
      ? 'fill="var(--ink-faint)" font-size="10"'
    : kind==="accent"
      ? 'fill="var(--accent)" font-size="11"'
    : kind==="good"
      ? 'fill="var(--good)" font-size="10.5"'
    : kind==="strong"
      ? 'fill="var(--ink)" font-size="11.5" font-weight="600"'
      : 'fill="var(--ink-soft)" font-size="10.5"';
  var anchor = kind==="mid" ? ' text-anchor="middle"' : kind==="end" ? ' text-anchor="end"' : '';
  if(kind==="mid"||kind==="end") st='fill="var(--ink-soft)" font-size="10.5"';
  o.push('<text x="'+x+'" y="'+y+'" '+st+' font-family="IBM Plex Sans"'+anchor+'>'+tx(pair)+'</text>');
}

/* ---------- 3 · visualizer library ---------- */
var VIZLIB = {};

/* MOTION — track with distance scale + fully scaled v–t graph */
VIZLIB.motion = {
  vb:"0 0 560 380", anim:true,
  ctrls:[
    {k:"u", lab:["Initial velocity u","ความเร็วต้น u"], min:-20,max:20,step:1, def:8,  unit:" m/s"},
    {k:"a", lab:["Acceleration a","ความเร่ง a"],        min:-10,max:10,step:.5,def:2,  unit:" m/s²"},
    {k:"T", lab:["Duration","ช่วงเวลา"],                min:2,  max:12,step:1, def:6,  unit:" s", isT:true}

    o.push('<line x1="'+A.X(0)+'" y1="'+A.Y(vA(0))+'" x2="'+A.X(T)+'" y2="'+A.Y(vA(T))+'" stroke="var(--ink-faint)" stroke-width="1.5" stroke-dasharray="3 3"/>');
    o.push('<line x1="'+A.X(0)+'" y1="'+A.Y(vA(0))+'" x2="'+nx+'" y2="'+ny+'" stroke="var(--accent)" stroke-width="2.5"/>');
    o.push('<line x1="'+nx+'" y1="'+ny+'" x2="'+nx+'" y2="'+(140+166)+'" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/>');
    o.push('<line x1="58" y1="'+ny+'" x2="'+nx+'" y2="'+ny+'" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/>');
    o.push('<circle cx="'+nx+'" cy="'+ny+'" r="4.5" fill="var(--accent)"/>');
  }
};

/* PLOT — generic scaled y = f(x) plotter. Node supplies fn, ranges, labels. */
VIZLIB.plot = {
  vb:"0 0 560 300", anim:false,
  draw:function(S,o,cfg){
    var xs=[],ys=[],N=160;
    for(var i=0;i<=N;i++){ var x=cfg.xmin+(cfg.xmax-cfg.xmin)*i/N; xs.push(x); ys.push(cfg.fn(x,S.p)); }

    if(cfg.fill) o.push('<path d="'+d+' L'+A.X(cfg.xmax)+' '+A.zy+' L'+A.X(cfg.xmin)+' '+A.zy+' Z" fill="var(--accent)" fill-opacity=".12"/>');

             '" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="5 4" opacity=".55"/>');
      for(var m=1;m<=N;m++){
        var d0=ys[m-1]-hv, d1=ys[m]-hv;
        if(d0===0||d0*d1<0){
          var f=d0===0?0:d0/(d0-d1), cx=A.X(xs[m-1]+(xs[m]-xs[m-1])*f);
          o.push('<circle cx="'+cx+'" cy="'+hy+'" r="3.6" fill="var(--ground)" '+
                 'stroke="var(--ink)" stroke-width="1.4"/>');
        }
      }
    }
    if(cfg.mark!=null){
      var mx=cfg.mark(S.p), my=cfg.fn(mx,S.p);
      o.push('<line x1="'+A.X(mx)+'" y1="'+A.Y(my)+'" x2="'+A.X(mx)+'" y2="'+A.zy+'" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity=".65"/>');
      o.push('<circle cx="'+A.X(mx)+'" cy="'+A.Y(my)+'" r="4.5" fill="var(--accent)"/>');
    }
  }
};

/* VECTOR — two vectors, magnitude + direction, with resultant drawn to scale */
VIZLIB.vector = {
  vb:"0 0 560 340", anim:false,
  ctrls:[
    {k:"A",  lab:["Magnitude A","ขนาด A"],  min:0,max:20,step:1,def:12, unit:""},
    {k:"tA", lab:["Angle A","มุม A"],       min:0,max:360,step:5,def:0,  unit:"°"},
    {k:"B",  lab:["Magnitude B","ขนาด B"],  min:0,max:20,step:1,def:9,  unit:""},
    {k:"tB", lab:["Angle B","มุม B"],       min:0,max:360,step:5,def:90, unit:"°"}
  ],
  readouts:[
    {lab:["Resultant R","ผลลัพธ์ R"], f:function(S){
      var p=S.p, rx=p.A*Math.cos(p.tA*Math.PI/180)+p.B*Math.cos(p.tB*Math.PI/180);
      var ry=p.A*Math.sin(p.tA*Math.PI/180)+p.B*Math.sin(p.tB*Math.PI/180);
      return fmt(Math.sqrt(rx*rx+ry*ry)); }},
    {lab:["Direction","ทิศทาง"], f:function(S){
      var p=S.p, rx=p.A*Math.cos(p.tA*Math.PI/180)+p.B*Math.cos(p.tB*Math.PI/180);
      var ry=p.A*Math.sin(p.tA*Math.PI/180)+p.B*Math.sin(p.tB*Math.PI/180);
      var d=Math.atan2(ry,rx)*180/Math.PI; if(d<0) d+=360; return fmt(d)+"°"; }}
  ],
  draw:function(S,o){
    var p=S.p, cx=280, cy=180, sc=6.5;
    var ax=p.A*Math.cos(p.tA*Math.PI/180), ay=p.A*Math.sin(p.tA*Math.PI/180);
    var bx=p.B*Math.cos(p.tB*Math.PI/180), by=p.B*Math.sin(p.tB*Math.PI/180);
    var rx=ax+bx, ry=ay+by;
    for(var g=-20;g<=20;g+=5){
      o.push('<line x1="'+(cx+g*sc)+'" y1="'+(cy-140)+'" x2="'+(cx+g*sc)+'" y2="'+(cy+140)+'" stroke="var(--rule)" stroke-width="1"/>');
      o.push('<line x1="'+(cx-250)+'" y1="'+(cy-g*sc)+'" x2="'+(cx+250)+'" y2="'+(cy-g*sc)+'" stroke="var(--rule)" stroke-width="1"/>');
    }
    o.push('<line x1="'+(cx-250)+'" y1="'+cy+'" x2="'+(cx+250)+'" y2="'+cy+'" stroke="var(--ink-faint)" stroke-width="1.4"/>');
    o.push('<line x1="'+cx+'" y1="'+(cy-140)+'" x2="'+cx+'" y2="'+(cy+140)+'" stroke="var(--ink-faint)" stroke-width="1.4"/>');
    for(var s=-20;s<=20;s+=10){ if(!s) continue;
      o.push('<text x="'+(cx+s*sc)+'" y="'+(cy+16)+'" '+FT+' text-anchor="middle">'+s+'</text>');
      o.push('<text x="'+(cx-8)+'" y="'+(cy-s*sc+3.5)+'" '+FT+' text-anchor="end">'+s+'</text>');
    }
    function arrow(x1,y1,x2,y2,col,w,dash){
      var ang=Math.atan2(y2-y1,x2-x1), hl=9;
      o.push('<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+w+'"'+(dash?' stroke-dasharray="4 4"':'')+'/>');
      if(Math.abs(x2-x1)+Math.abs(y2-y1)>4)
        o.push('<path d="M'+x2+' '+y2+' L'+(x2-hl*Math.cos(ang-.4))+' '+(y2-hl*Math.sin(ang-.4))+' L'+(x2-hl*Math.cos(ang+.4))+' '+(y2-hl*Math.sin(ang+.4))+' Z" fill="'+col+'"/>');
    }
    arrow(cx,cy,cx+ax*sc,cy-ay*sc,"var(--ink-soft)",2);
    arrow(cx+ax*sc,cy-ay*sc,cx+rx*sc,cy-ry*sc,"var(--ink-faint)",1.6,true);
    arrow(cx,cy,cx+rx*sc,cy-ry*sc,"var(--accent)",2.8);
    o.push('<text x="'+(cx+ax*sc/2-10)+'" y="'+(cy-ay*sc/2-6)+'" fill="var(--ink-soft)" font-family="IBM Plex Sans" font-size="11" font-weight="600">A</text>');
    o.push('<text x="'+(cx+ax*sc+bx*sc/2+6)+'" y="'+(cy-ay*sc-by*sc/2)+'" '+FT+' font-weight="600">B</text>');
    o.push('<text x="'+(cx+rx*sc/2+6)+'" y="'+(cy-ry*sc/2+14)+'" fill="var(--accent)" font-family="IBM Plex Sans" font-size="12" font-weight="600">R</text>');
  }
};

/* WAVE — travelling sine wave with wavelength, amplitude, frequency, to scale */
VIZLIB.wave = {

  ],

    /* a tracked particle showing it only moves up and down */

var COL = { accent:"var(--accent)", good:"var(--good)", warn:"var(--warn)",
            ink:"var(--ink)", soft:"var(--ink-soft)", faint:"var(--ink-faint)" };

/* BARS — compare quantities that move together. cfg.bars:[{lab,f,col}] */
VIZLIB.bars = {
  vb:"0 0 560 300", anim:false,
  draw:function(S,o,cfg){
    var B=cfg.bars.map(function(b){ return {lab:b.lab, v:b.f(S.p), c:col(b.col)}; });
    var vs=B.map(function(b){ return b.v; });
    var hi=Math.max.apply(null,vs.concat([0])), lo=Math.min.apply(null,vs.concat([0]));
    if(cfg.ymax!=null) hi=cfg.ymax;
    if(cfg.ymin!=null) lo=cfg.ymin;
    var pad=Math.max(1e-6,(hi-lo)*0.18); hi+=pad; if(lo<0) lo-=pad;
    var n=B.length, A=axes(o,{x:64,y:54,w:452,h:184,xmin:0,xmax:n,ymin:lo,ymax:hi,
                             title:cfg.title, ylab:cfg.ylab, xticks:0, yticks:5});
    var w=452/n, bw=Math.min(74,w*0.56);
    B.forEach(function(b,i){
      var cx=A.X(i+0.5), y0=A.Y(0), y1=A.Y(b.v);
      o.push('<rect x="'+(cx-bw/2)+'" y="'+Math.min(y0,y1)+'" width="'+bw+
             '" height="'+Math.abs(y1-y0)+'" fill="'+b.c+'" opacity="0.9"/>');
      o.push('<text x="'+cx+'" y="'+(y1+(b.v<0?15:-7))+'" fill="var(--ink)" font-family="IBM Plex Sans" '+
             'font-size="11" font-weight="600" text-anchor="middle">'+fmt2(b.v)+'</text>');
      o.push('<text x="'+cx+'" y="'+(A.Y(lo)+34)+'" fill="var(--ink-soft)" font-family="IBM Plex Sans" '+
             'font-size="10" text-anchor="middle">'+tx(b.lab)+'</text>');
    });

};

/* NUMLINE — points and intervals on a real line. cfg.regions(p), cfg.points(p) */

/* TRI — a triangle drawn to scale from two sides and the included angle */
VIZLIB.tri = {
  vb:"0 0 560 300", anim:false,
  draw:function(S,o,cfg){
    var g=cfg.sides(S.p), a=g.a, b=g.b, C=g.C*Math.PI/180;
    var c=Math.sqrt(a*a+b*b-2*a*b*Math.cos(C));
    var A1=Math.asin(Math.min(1,a*Math.sin(C)/(c||1)));
    var B1=Math.PI-C-A1;
    /* place C at origin, b along +x, a at angle C */
    var P={ C:[0,0], A:[b,0], B:[a*Math.cos(C), a*Math.sin(C)] };
    var xs=[P.C[0],P.A[0],P.B[0]], ys=[P.C[1],P.A[1],P.B[1]];
    var mnx=Math.min.apply(null,xs), mxx=Math.max.apply(null,xs);
    var mny=Math.min.apply(null,ys), mxy=Math.max.apply(null,ys);
    var sc=Math.min(360/Math.max(1e-6,mxx-mnx), 170/Math.max(1e-6,mxy-mny));
    var ox=150-mnx*sc, oy=230+mny*sc;
    var T=function(p){ return [ox+p[0]*sc, oy-p[1]*sc]; };
    var tC=T(P.C), tA=T(P.A), tB=T(P.B);
    if(cfg.title) cap(o,44,40,cfg.title,"eyebrow");
    o.push('<path d="M'+tC[0]+' '+tC[1]+' L'+tA[0]+' '+tA[1]+' L'+tB[0]+' '+tB[1]+
           ' Z" fill="var(--accent)" fill-opacity="0.10" stroke="var(--ink)" stroke-width="2.2"/>');
    function side(p,q,lab,val,c2){
      o.push('<text x="'+((p[0]+q[0])/2)+'" y="'+((p[1]+q[1])/2-6)+'" fill="'+c2+
             '" font-family="IBM Plex Sans" font-size="11" text-anchor="middle">'+lab+' = '+fmt2(val)+'</text>');
    }
    side(tC,tA,"b",b,"var(--ink-soft)");
    side(tC,tB,"a",a,"var(--ink-soft)");
    side(tA,tB,"c",c,"var(--accent)");
    [[tC,"C",g.C],[tA,"A",A1*180/Math.PI],[tB,"B",B1*180/Math.PI]].forEach(function(v){
      o.push('<circle cx="'+v[0][0]+'" cy="'+v[0][1]+'" r="3.5" fill="var(--ink)"/>');
      o.push('<text x="'+(v[0][0]-14)+'" y="'+(v[0][1]+14)+'" fill="var(--ink)" font-family="IBM Plex Sans" '+
             'font-size="10.5" font-weight="600">'+v[1]+' '+fmt(v[2])+'°</text>');
    });
    var area=0.5*a*b*Math.sin(C);
    o.push('<text x="404" y="86" fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="10" letter-spacing="1.2">'+
           tx(["THIRD SIDE","ด้านที่สาม"])+'</text>');
    o.push('<text x="404" y="118" fill="var(--accent)" font-family="Bodoni Moda, serif" font-size="30">'+fmt2(c)+'</text>');
    o.push('<text x="404" y="152" fill="var(--ink-faint)" font-family="IBM Plex Sans" font-size="10" letter-spacing="1.2">'+
           tx(["AREA ½ ab sin C","พื้นที่ ½ ab sin C"])+'</text>');
    o.push('<text x="404" y="182" fill="var(--ink)" font-family="Bodoni Moda, serif" font-size="26">'+fmt2(area)+'</text>');
    if(cfg.note) cap(o,44,286,cfg.note,"note");
  }
};

/* FBD — a body with force arrows, optionally on an incline */
VIZLIB.fbd = {
  vb:"0 0 560 320", anim:false,
  draw:function(S,o,cfg){
    var inc=cfg.incline?cfg.incline(S.p):0, r=inc*Math.PI/180;
    var cx=270, cy=180;
    if(cfg.title) cap(o,44,40,cfg.title,"eyebrow");
    if(inc>0){
      var L=210, H=L*Math.tan(r);
      o.push('<path d="M'+(cx-L/2)+' '+(cy+56)+' L'+(cx+L/2)+' '+(cy+56)+' L'+(cx+L/2)+' '+(cy+56-H)+
             ' Z" fill="var(--surface)" stroke="var(--ink-faint)" stroke-width="1.5"/>');
      o.push('<text x="'+(cx-L/2+26)+'" y="'+(cy+50)+'" fill="var(--ink-faint)" font-family="IBM Plex Sans" '+
             'font-size="10">'+fmt(inc)+'°</text>');
    } else {
      o.push('<line x1="'+(cx-120)+'" y1="'+(cy+34)+'" x2="'+(cx+120)+'" y2="'+(cy+34)+
             '" stroke="var(--ink-faint)" stroke-width="1.5"/>');
    }
    o.push('<rect x="'+(cx-24)+'" y="'+(cy-20)+'" width="48" height="48" fill="var(--ink)" opacity="0.88"/>');
    var F=cfg.forces(S.p);
    var mx=Math.max.apply(null,F.map(function(f){ return Math.abs(f.mag); }).concat([1]));
    F.forEach(function(f){
      if(Math.abs(f.mag)<1e-6) return;
      var ang=f.ang*Math.PI/180, len=18+Math.abs(f.mag)/mx*84;
      var sgn=f.mag<0?-1:1;
      var ex=cx+Math.cos(ang)*len*sgn, ey=cy-Math.sin(ang)*len*sgn;
      var c2=col(f.col||"accent"), hl=9, aa=Math.atan2(ey-cy,ex-cx);
      o.push('<line x1="'+cx+'" y1="'+cy+'" x2="'+ex+'" y2="'+ey+'" stroke="'+c2+'" stroke-width="2.6"/>');
      o.push('<path d="M'+ex+' '+ey+' L'+(ex-hl*Math.cos(aa-0.4))+' '+(ey-hl*Math.sin(aa-0.4))+
             ' L'+(ex-hl*Math.cos(aa+0.4))+' '+(ey-hl*Math.sin(aa+0.4))+' Z" fill="'+c2+'"/>');
      o.push('<text x="'+(cx+Math.cos(aa)*(len+24))+'" y="'+(cy+Math.sin(aa)*(len+24)+4)+'" fill="'+c2+
             '" font-family="IBM Plex Sans" font-size="10.5" text-anchor="middle">'+tx(f.lab)+' '+fmt(Math.abs(f.mag))+'</text>');
    });
    if(cfg.note) cap(o,44,300,cfg.note,"note");
  }
};

/* STACK — a part-whole bar, for conservation and proportion arguments */

/* ============================================================
   SCENES · see [[Visualizer Concepts]]
   Every lab is a drawn piece of daily life (top band) with the
   measurement taken from it (bottom band), joined by a leader
   line. Scene builders live in SCENE; VIZLIB.scene composes one
   with an instrument.
   ============================================================ */

var FR = { qy:22, sx:30, sw:500, sy:34, ground:214, div:250,
           iy:268, ih:144, ix:64, iw:462 };

/* A dimension line with end ticks and a centred label. Used constantly. */
function dim(o, x1, x2, y, pair, c){
  c = c || "var(--ink-soft)";
  if(Math.abs(x2-x1) < 2) return;
  o.push('<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+c+'" stroke-width="1.3"/>');
  [x1,x2].forEach(function(x){
    o.push('<line x1="'+x+'" y1="'+(y-4)+'" x2="'+x+'" y2="'+(y+4)+'" stroke="'+c+'" stroke-width="1.3"/>');
  });
  if(pair) o.push('<text x="'+((x1+x2)/2)+'" y="'+(y-7)+'" fill="'+c+
                  '" font-family="IBM Plex Sans" font-size="10.5" text-anchor="middle">'+tx(pair)+'</text>');
}

/* Thai has no word spaces, so long labels shrink rather than wrap. */
function fitText(o, x, y, pair, maxw, size, c, anchor){
  var s = tx(pair), fs = size;
  var est = s.length * size * 0.56;
  if(est > maxw) fs = Math.max(7.5, size * maxw / est);
  o.push('<text x="'+x+'" y="'+y+'" fill="'+(c||"var(--ink-soft)")+
         '" font-family="IBM Plex Sans" font-size="'+fmt2(fs)+'"'+
         (anchor?' text-anchor="'+anchor+'"':'')+'>'+s+'</text>');
}

/* A gauge arc with a needle, for the `dial` instrument. */
function needle(o, cx, cy, r, frac, pair, unit){
  var a0 = Math.PI*0.82, a1 = Math.PI*0.18;
  function pt(a, rr){ return [cx+Math.cos(a)*rr, cy-Math.sin(a)*rr]; }
  var p0=pt(a0,r), p1=pt(a1,r);
  o.push('<path d="M'+fmt2(p0[0])+' '+fmt2(p0[1])+' A'+r+' '+r+' 0 0 1 '+fmt2(p1[0])+' '+fmt2(p1[1])+
         '" fill="none" stroke="var(--rule)" stroke-width="7"/>');
  var f = Math.max(0, Math.min(1, frac));
  var ae = a0 + (a1-a0)*f, pe=pt(ae,r);
  o.push('<path d="M'+fmt2(p0[0])+' '+fmt2(p0[1])+' A'+r+' '+r+' 0 0 1 '+fmt2(pe[0])+' '+fmt2(pe[1])+
         '" fill="none" stroke="var(--accent)" stroke-width="7"/>');
  var tip=pt(ae, r-9);
  o.push('<line x1="'+cx+'" y1="'+cy+'" x2="'+fmt2(tip[0])+'" y2="'+fmt2(tip[1])+
         '" stroke="var(--ink)" stroke-width="2.4"/>');
  o.push('<circle cx="'+cx+'" cy="'+cy+'" r="3.5" fill="var(--ink)"/>');
  if(pair) o.push('<text x="'+cx+'" y="'+(cy+20)+'" fill="var(--ink-faint)" font-family="IBM Plex Sans" '+
                  'font-size="10" text-anchor="middle">'+tx(pair)+'</text>');
  if(unit!=null) o.push('<text x="'+cx+'" y="'+(cy-14)+'" fill="var(--ink)" font-family="Bodoni Moda, serif" '+
                        'font-size="19" text-anchor="middle">'+unit+'</text>');
}

/* ---------- silhouettes ----------
   Five shapes or fewer, readable at 40px. Never illustrations. */
var FIG = {};
FIG.moto = function(o,x,y,c,flip){
  var d = flip?-1:1, s=1;
  o.push('<ellipse cx="'+x+'" cy="'+(y+3)+'" rx="21" ry="3.5" fill="var(--ink)" opacity=".13"/>');
  o.push('<circle cx="'+(x-13*d)+'" cy="'+(y-6)+'" r="6.5" fill="none" stroke="'+c+'" stroke-width="2.4"/>');
  o.push('<circle cx="'+(x+13*d)+'" cy="'+(y-6)+'" r="6.5" fill="none" stroke="'+c+'" stroke-width="2.4"/>');
  o.push('<path d="M'+(x-13*d)+' '+(y-6)+' L'+(x-2*d)+' '+(y-14)+' L'+(x+13*d)+' '+(y-6)+
         '" fill="none" stroke="'+c+'" stroke-width="2.4" stroke-linejoin="round"/>');
  o.push('<path d="M'+(x-4*d)+' '+(y-15)+' q'+(3*d)+' -11 '+(9*d)+' -11 q'+(5*d)+' 0 '+(6*d)+' 5" '+

};
FIG.ball = function(o,x,y,c,r){

};
FIG.post = function(o,x,y,c){
  o.push('<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y-46)+'" stroke="'+c+'" stroke-width="2"/>');
  o.push('<path d="M'+x+' '+(y-46)+' q0 -7 9 -7" fill="none" stroke="'+c+'" stroke-width="2"/>');

};
FIG.light = function(o,x,y,c,on){
  o.push('<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y-52)+'" stroke="var(--ink-faint)" stroke-width="2"/>');
  o.push('<rect x="'+(x-6)+'" y="'+(y-76)+'" width="12" height="26" rx="2" fill="none" stroke="var(--ink-faint)" stroke-width="1.6"/>');
  o.push('<circle cx="'+x+'" cy="'+(y-69)+'" r="3.2" fill="'+(on?"var(--ink-faint)":"var(--accent)")+'" opacity="'+(on?".3":"1")+'"/>');
  o.push('<circle cx="'+x+'" cy="'+(y-57)+'" r="3.2" fill="'+(on?"var(--good)":"var(--ink-faint)")+'" opacity="'+(on?"1":".3")+'"/>');

FIG.zebra = function(o,x,y,c,w){
  w = w||34;
  for(var i=0;i<5;i++)
    o.push('<rect x="'+(x-w/2+i*(w/5))+'" y="'+(y-3)+'" width="'+(w/5-2.5)+'" height="7" fill="var(--ink-faint)" opacity=".55"/>');
};
FIG.tree = function(o,x,y,c){
  o.push('<line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y-40)+'" stroke="var(--ink-faint)" stroke-width="3"/>');
  o.push('<path d="M'+(x-20)+' '+(y-40)+' q20 -30 40 0 z" fill="var(--good)" opacity=".22" stroke="var(--good)" stroke-width="1.6"/>');
};

/* ---------- scene builders ---------- */
var SCENE = {};

/* ROAD — a street with distance markers, props and vehicles.
   Returns X(metres)->px so the instrument band can align to it. */
SCENE.road = function(S,o,sc){
  var p = S.p;
  var span = sc.span ? sc.span(p) : 60;
  if(!(span>0)) span = 1;
  var X = function(m){ return FR.sx + (m/span)*FR.sw; };
  var g = FR.ground;

  o.push('<rect x="'+FR.sx+'" y="'+(g-2)+'" width="'+FR.sw+'" height="16" fill="var(--ink)" opacity=".055"/>');
  o.push('<line x1="'+FR.sx+'" y1="'+g+'" x2="'+(FR.sx+FR.sw)+'" y2="'+g+'" stroke="var(--ink-soft)" stroke-width="1.6"/>');

  var step = niceStep(span, 6);
  for(var m=0; m<=span+1e-9; m+=step){
    var gx=X(m);
    o.push('<line x1="'+fmt2(gx)+'" y1="'+g+'" x2="'+fmt2(gx)+'" y2="'+(g+7)+'" stroke="var(--ink-faint)" stroke-width="1"/>');
    o.push('<text x="'+fmt2(gx)+'" y="'+(g+20)+'" '+FT+' text-anchor="middle">'+tk(m)+'</text>');
  }
  o.push('<text x="'+(FR.sx+FR.sw)+'" y="'+(g+34)+'" '+FT+' text-anchor="end">'+
         tx(sc.unit||["metres","เมตร"])+'</text>');

  (sc.props ? sc.props(p) : []).forEach(function(pr){
    var f = FIG[pr.kind];
    if(f) f(o, X(pr.x), g, pr.col||"var(--ink-faint)", pr.arg);
    if(pr.lab) fitText(o, X(pr.x), g-84, pr.lab, 90, 10, "var(--ink-faint)", "middle");
  });

  (sc.cast ? sc.cast(p,S) : []).forEach(function(v){
    var f = FIG[v.kind] || FIG.ball;
    var yy = g - (v.lift||0);
    f(o, X(v.x), yy, v.col||"var(--accent)", v.arg);
    if(v.lab) fitText(o, X(v.x), yy-(v.kind==="moto"?42:18), v.lab, 120, 10.5, v.col||"var(--accent)", "middle");
  });

  (sc.marks ? sc.marks(p) : []).forEach(function(mk,i){
    dim(o, X(mk.a), X(mk.b), g+44+i*22, mk.lab, mk.col||"var(--accent)");
  });

  return { X:X, span:span };
};

/* ROAD, stood on end. Same archetype — a 1-D track with a scale —

SCENE.drop = function(S,o,sc){

  var span = sc.span ? sc.span(p) : 20;
  if(!(span>0)) span=1;
  var base = FR.ground, top = FR.sy+16;
  var Y = function(h){ return base - (h/span)*(base-top); };
  var lane = function(i){ return FR.sx + 150 + i*130; };

  o.push('<rect x="'+FR.sx+'" y="'+base+'" width="'+FR.sw+'" height="12" fill="var(--ink)" opacity=".055"/>');
  o.push('<line x1="'+FR.sx+'" y1="'+base+'" x2="'+(FR.sx+FR.sw)+'" y2="'+base+'" stroke="var(--ink-soft)" stroke-width="1.6"/>');

  var step = niceStep(span,5);
  for(var h=0; h<=span+1e-9; h+=step){
    var gy=Y(h);
    o.push('<line x1="'+(FR.sx+62)+'" y1="'+fmt2(gy)+'" x2="'+(FR.sx+FR.sw)+'" y2="'+fmt2(gy)+
           '" stroke="var(--rule)" stroke-width="1"/>');
    o.push('<text x="'+(FR.sx+56)+'" y="'+fmt2(gy+3.5)+'" '+FT+' text-anchor="end">'+tk(h)+'</text>');
  }
  o.push('<text x="'+(FR.sx+56)+'" y="'+(top-6)+'" '+FT+' text-anchor="end">'+tx(sc.unit||["m","m"])+'</text>');

  (sc.cast ? sc.cast(p,S) : []).forEach(function(v,i){

    if(v.trail) o.push('<line x1="'+lx+'" y1="'+fmt2(Y(v.from!=null?v.from:span))+'" x2="'+lx+'" y2="'+fmt2(Y(v.h))+
                       '" stroke="'+(v.col||"var(--accent)")+'" stroke-width="1.2" stroke-dasharray="3 4" opacity=".55"/>');
    f(o, lx, Y(v.h), v.col||"var(--accent)", v.arg);
    if(v.lab) fitText(o, lx, Y(v.h)-18, v.lab, 118, 10.5, v.col||"var(--accent)", "middle");

  (sc.marks ? sc.marks(p) : []).forEach(function(mk,i){
    var mx = FR.sx + 96 + i*20;
    var y1=Y(mk.a), y2=Y(mk.b), c=mk.col||"var(--accent)";
    o.push('<line x1="'+mx+'" y1="'+fmt2(y1)+'" x2="'+mx+'" y2="'+fmt2(y2)+'" stroke="'+c+'" stroke-width="1.3"/>');
    [y1,y2].forEach(function(yy){

    });
    if(mk.lab) o.push('<text x="'+(mx+7)+'" y="'+fmt2((y1+y2)/2+3)+'" fill="'+c+
                      '" font-family="IBM Plex Sans" font-size="10.5">'+tx(mk.lab)+'</text>');
  });

  return { X:function(){ return FR.sx+FR.sw/2; }, Y:Y, span:span };
};

/* ---------- instrument band ---------- */

function instrument(S, o, ins, ctx){
  if(!ins) return null;
  var k = ins.kind || "graph";

  if(k === "graph"){
    var N=140, xs=[], ys=[], i;
    for(i=0;i<=N;i++){ var x=ins.xmin+(ins.xmax-ins.xmin)*i/N; xs.push(x); ys.push(ins.fn(x,S.p,S)); }
    var hi=Math.max.apply(null,ys.concat([0])), lo=Math.min.apply(null,ys.concat([0]));
    if(ins.ymin!=null) lo=ins.ymin;
    if(ins.ymax!=null) hi=ins.ymax;
    var pad=Math.max(.4,(hi-lo)*0.16); hi+=pad; if(lo<0) lo-=pad;
    var A=axes(o,{x:FR.ix,y:FR.iy,w:FR.iw,h:FR.ih,xmin:ins.xmin,xmax:ins.xmax,ymin:lo,ymax:hi,
                  xlab:ins.xlab, ylab:ins.ylab, xticks:ins.xticks, yticks:ins.yticks});
    var d="";
    for(i=0;i<=N;i++) d+=(i?" L":"M")+fmt2(A.X(xs[i]))+" "+fmt2(A.Y(ys[i]));
    /* the fill may stop short of the curve, so the area can be watched growing */
    if(ins.fill){
      var upto = ins.upto ? ins.upto(S.p,S) : ins.xmax;
      upto = Math.max(ins.xmin, Math.min(ins.xmax, upto));
      var fd="";
      for(i=0;i<=N;i++){
        var fx=ins.xmin+(upto-ins.xmin)*i/N;
        fd+=(i?" L":"M")+fmt2(A.X(fx))+" "+fmt2(A.Y(ins.fn(fx,S.p,S)));
      }
      if(upto>ins.xmin)
        o.push('<path d="'+fd+' L'+fmt2(A.X(upto))+' '+fmt2(A.zy)+' L'+fmt2(A.X(ins.xmin))+' '+
               fmt2(A.zy)+' Z" fill="var(--accent)" fill-opacity=".14"/>');
    }
    o.push('<path d="'+d+'" stroke="var(--accent)" stroke-width="2.4" fill="none"/>');
    if(ins.mark!=null){
      var mx=ins.mark(S.p,S), my=ins.fn(mx,S.p,S);
      o.push('<line x1="'+fmt2(A.X(mx))+'" y1="'+fmt2(A.Y(my))+'" x2="'+fmt2(A.X(mx))+'" y2="'+fmt2(A.zy)+
             '" stroke="var(--accent)" stroke-width="1" stroke-dasharray="2 3" opacity=".7"/>');
      o.push('<circle cx="'+fmt2(A.X(mx))+'" cy="'+fmt2(A.Y(my))+'" r="4.5" fill="var(--accent)"/>');
      return { X:A.X, markX:A.X(mx) };
    }
    return { X:A.X };
  }

  if(k === "bar"){
    var B=ins.bars.map(function(b){ return {lab:b.lab, v:b.f(S.p,S), c:col(b.col)}; });
    var vs=B.map(function(b){ return b.v; });
    var h2=Math.max.apply(null,vs.concat([0])), l2=Math.min.apply(null,vs.concat([0]));
    if(ins.ymax!=null) h2=ins.ymax;
    var pd=Math.max(1e-6,(h2-l2)*0.2); h2+=pd; if(l2<0) l2-=pd;
    var A2=axes(o,{x:FR.ix,y:FR.iy,w:FR.iw,h:FR.ih-18,xmin:0,xmax:B.length,ymin:l2,ymax:h2,
                   ylab:ins.ylab, xticks:0, yticks:4});
    var w=FR.iw/B.length, bw=Math.min(66,w*0.5);
    B.forEach(function(b,j){
      var cx=A2.X(j+0.5), y0=A2.Y(0), y1=A2.Y(b.v);
      o.push('<rect x="'+fmt2(cx-bw/2)+'" y="'+fmt2(Math.min(y0,y1))+'" width="'+fmt2(bw)+
             '" height="'+fmt2(Math.abs(y1-y0))+'" fill="'+b.c+'" opacity=".9"/>');
      o.push('<text x="'+fmt2(cx)+'" y="'+fmt2(y1+(b.v<0?14:-7))+'" fill="var(--ink)" '+
             'font-family="IBM Plex Sans" font-size="11" font-weight="600" text-anchor="middle">'+fmt2(b.v)+'</text>');
      fitText(o, cx, A2.Y(l2)+32, b.lab, w-6, 10, "var(--ink-soft)", "middle");
    });
    return null;
  }

  if(k === "strip"){
    var P=ins.parts(S.p,S);
    var tot=P.reduce(function(a,q){ return a+Math.max(0,q.v); },0)||1;
    var x0=FR.ix, w2=FR.iw, y=FR.iy+26, hh=48, x=x0;
    P.forEach(function(q){
      var pw=Math.max(0,q.v)/tot*w2;
      o.push('<rect x="'+fmt2(x)+'" y="'+y+'" width="'+fmt2(pw)+'" height="'+hh+'" fill="'+col(q.col)+'" opacity=".88"/>');
      if(pw>36) o.push('<text x="'+fmt2(x+pw/2)+'" y="'+(y+hh/2+4)+'" fill="#fff" font-family="IBM Plex Sans" '+

/* ---------- 3.5 · art layer ----------

   Raster and vector art that decorates a visualizer, per the asset contract in
   Project Concept 9 and the body-and-clothes rule in 4:

     - art lives beside the package at  assets/ch<NN>/<name>.<ext>  and is never
       inlined, so the HTML stays the unit of distribution
     - the page must work with assets/ deleted, so every reference is optional
       and a failed load leaves the scene drawn and the lesson intact
     - no meaning may live only in an image: captions and hotspot labels are
       SVG <text> from [en,th] pairs on the layer above, so they translate

   Art sits on its own <svg>, drawn once, behind the scene layer that redraws
   every frame. That keeps an animating visualizer from re-parsing the image
   sixty times a second, and keeps the picture still while the labels move. */

var ART = {
  base: function(){ return "assets/ch" + (CHAPTER.num || "00") + "/"; },
  seen: {},                                  /* src -> "wait" | "ok" | "gone" */

  url: function(src){
    return /^(?:[a-z]+:|\/|\.)/i.test(src) ? src : ART.base() + src;
  },

  /* Ask for a file once. Load and failure both redraw, so the first paint can
     go ahead without waiting and the picture drops in when it arrives. */
  ask: function(src){
    var u = ART.url(src);
    if(ART.seen[u]) return ART.seen[u];
    ART.seen[u] = "wait";
    var im = new Image();
    im.onload  = function(){ ART.seen[u] = "ok";   ART.repaint(); };
    im.onerror = function(){ ART.seen[u] = "gone"; ART.repaint(); };
    im.src = u;
    return "wait";
  },

  ready: function(src){ return ART.ask(src) === "ok"; },

  dark: function(){
    var m = document.documentElement.getAttribute("data-theme");
    if(m) return m === "dark";
    return !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
  },

  /* Which file to show, and how, for the theme in force.

     11.5 relieves the artist of any dark-matting duty: assets may assume a
     light ground. The consequence lands here instead - a light-ground plate
     dropped on the dark theme reads as a grey slab. So on dark the engine
     shows an authored dark variant if there is one, inverts a texture that
     says it may be inverted, and otherwise shows nothing. Hiding is the safe
     default because inverting real artwork would misrepresent it, and a
     missing decoration is a state the page is already required to survive. */
  pick: function(a){
    if(!a || !a.src) return null;
    if(!ART.dark()) return { src: a.src, cls: "" };
    if(a.srcDark)   return { src: a.srcDark, cls: "" };
    if(a.dark === "invert") return { src: a.src, cls: "art-invert" };
    if(a.dark === "as-is")  return { src: a.src, cls: "" };
    return null;
  },

  repaint: function(){
    if(typeof LABS === "undefined") return;
    LABS.forEach(function(l){ if(l.repaintArt) l.repaintArt(); });
  },

  /* One <image>, or nothing at all if the file is absent. `fit` follows
     preserveAspectRatio; the default letterboxes rather than distorts. */
  tag: function(a, vb){
    var use = ART.pick(a);
    if(!use || !ART.ready(use.src)) return "";
    var box = ART.box(a, vb);
    return '<image class="' + use.cls + '" href="' + esc(ART.url(use.src)) + '"' +
           ' x="' + box.x + '" y="' + box.y +
           '" width="' + box.w + '" height="' + box.h + '"' +
           ' preserveAspectRatio="' + (a.fit || "xMidYMid meet") + '"' +
           (a.opacity != null ? ' opacity="' + a.opacity + '"' : "") +
           ' aria-hidden="true"/>';
  },

  /* Default to filling the visualizer's own viewBox, so a decorating image
     needs nothing but a filename. */
  box: function(a, vb){
    var v = (vb || "0 0 560 340").split(/\s+/);
    return { x: a.x != null ? a.x : +v[0], y: a.y != null ? a.y : +v[1],
             w: a.w != null ? a.w : +v[2], h: a.h != null ? a.h : +v[3] };
  }
};


/* A plate: the artwork is the scene. Labels sit over it as real text, so the
   plate still says what it means when the file is missing or the reader
   switches language. */
VIZLIB.plate = {
  vb: "0 0 560 340",
  draw: function(S, o, cfg){
    var vb = (cfg && cfg.vb) || VIZLIB.plate.vb,
        v = vb.split(/\s+/), w = +v[2], h = +v[3],
