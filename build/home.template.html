<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__SITE_EN__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Sans:wght@500;600&family=IBM+Plex+Sans+Thai:wght@500;600&display=swap">
<style>
__CSS__

/* ---------- home-only ---------- */
.hero{padding:40px 0 30px;border-bottom:1px solid var(--rule);margin-bottom:40px}
.hero h1{margin:8px 0 0;font-family:var(--f-display);font-weight:400;
  font-size:clamp(40px,7.5vw,76px);line-height:1;letter-spacing:-.02em}
.hero .sub{margin:18px 0 0;color:var(--ink-soft);max-width:60ch;font-size:17px}
.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:28px}
.stat b{display:block;font-family:var(--f-display);font-size:36px;line-height:1}
.stat span{font-family:var(--f-ui);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.bar{height:3px;background:var(--rule);margin-top:24px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);display:block}

/* Two subjects side by side, the cross-subject sheet on its own line beneath:
   the hierarchy of the collection, drawn with space rather than boxes. */
.ways{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-bottom:1px}
.way{background:var(--ground);padding:30px 28px 26px;display:flex;flex-direction:column;
  gap:12px;text-decoration:none;color:inherit;min-height:230px;transition:background .14s}
a.way:hover{background:var(--surface)}
a.way:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.way h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:34px;
  line-height:1.05;letter-spacing:-.015em}
.way .th{margin:0;font-size:15px;color:var(--ink-soft)}
.way p.what{margin:4px 0 0;color:var(--ink-soft);font-size:15px;line-height:1.6}
.way .foot{margin-top:auto;padding-top:16px;display:flex;gap:16px;flex-wrap:wrap;
  font-family:var(--f-ui);font-size:10.5px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint)}
.way .go{font-family:var(--f-ui);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink)}
a.way:hover .go{color:var(--accent)}

/* the cross-subject sheet reads as a wide plate, not a third subject */
.ways.cross{grid-template-columns:1fr;margin-bottom:46px}
.ways.cross .way{min-height:0;padding:26px 28px}
.ways.cross .way h2{font-size:27px}

.note{margin:0 0 46px;color:var(--ink-soft);font-size:15px;max-width:66ch}
.note b{font-weight:600;color:var(--ink)}
</style>
</head>
<body>
<div class="shell">

<header class="mast">
  <div class="mast-id">
    <span class="ch" data-en="Learning packages" data-th="ชุดบทเรียน"></span>
  </div>
  <div class="mast-tools">
    <button class="btn" id="langBtn" type="button">ไทย</button>
    <button class="btn" id="themeBtn" type="button" data-en="Dark" data-th="มืด"></button>
  </div>
</header>

<section class="hero">
  <span class="label" data-en="__LEVEL_EN__" data-th="__LEVEL_TH__"></span>
  <h1 data-en="__SITE_EN__" data-th="__SITE_TH__"></h1>
  <p class="sub" data-en="Thirty-six self-contained chapters across physics and mathematics. Every chapter is a single file that works offline: a knowledge map to open on, its concepts with visualizers you can drive, and a forge that generates exam questions across every solution method the chapter teaches."
                 data-th="สามสิบหกบทเรียนแบบครบในตัว ครอบคลุมฟิสิกส์และคณิตศาสตร์ ทุกบทเป็นไฟล์เดียวที่ใช้งานออฟไลน์ได้ เปิดมาเจอแผนที่ความรู้ มีเนื้อหาพร้อมตัวจำลองที่ปรับเล่นได้ และห้องฝึกที่สร้างข้อสอบครอบคลุมทุกวิธีแก้โจทย์ในบทนั้น"></p>
  <div class="stats">
    <div class="stat"><b>__CHAPTERS__</b><span data-en="chapters" data-th="บทเรียน"></span></div>
    <div class="stat"><b>__NODES__</b><span data-en="concept nodes" data-th="โหนดความรู้"></span></div>
    <div class="stat"><b>__METHODS__</b><span data-en="exam methods" data-th="วิธีทำข้อสอบ"></span></div>
    <div class="stat"><b>__LINKS__</b><span data-en="cross-subject links" data-th="ความเชื่อมโยงข้ามวิชา"></span></div>
  </div>
  <div class="bar"><i style="width:__PCT__%"></i></div>
</section>

__WAYS__

<p class="note" data-en="Start with a subject. Each one opens on its dependency map, so you can see which chapter is safe to read next before you commit to it."
                data-th="เริ่มจากเลือกวิชา แต่ละวิชาเปิดมาที่แผนผังลำดับก่อนหลัง จะได้เห็นว่าบทไหนพร้อมให้อ่านต่อก่อนตัดสินใจ"></p>

<footer class="foot">
  <span data-en="Every chapter works offline · no server · no account" data-th="ทุกบทใช้งานออฟไลน์ · ไม่ต้องมีเซิร์ฟเวอร์ · ไม่ต้องสมัคร"></span>
</footer>
</div>

<script>
(function(){
  var K="lp.home.v1", st={lang:"en",theme:null};
  try{ var r=localStorage.getItem(K); if(r) st=JSON.parse(r); }catch(e){}
  function save(){ try{ localStorage.setItem(K,JSON.stringify(st)); }catch(e){} }
  function apply(){
    document.documentElement.setAttribute("lang",st.lang);
    var k="data-"+st.lang;
    document.querySelectorAll("["+k+"]").forEach(function(el){ el.textContent=el.getAttribute(k); });
    document.getElementById("langBtn").textContent = st.lang==="en"?"ไทย":"English";
    var dark=document.documentElement.getAttribute("data-theme")==="dark";
    document.getElementById("themeBtn").textContent =
      dark ? (st.lang==="en"?"Light":"สว่าง") : (st.lang==="en"?"Dark":"มืด");
  }
  document.getElementById("langBtn").addEventListener("click",function(){
    st.lang = st.lang==="en"?"th":"en"; save(); apply();
  });
  document.getElementById("themeBtn").addEventListener("click",function(){
    var next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
    document.documentElement.setAttribute("data-theme",next); st.theme=next; save(); apply();
  });
  if(st.theme) document.documentElement.setAttribute("data-theme",st.theme);
  apply();
})();
</script>
</body>
</html>
